<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFETP Tracker</title>
<meta name="description" content="Digital CFETP, upgrade training, certifications and DAF Form 623A tracker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   CFETP Tracker — design system
   ===================================================================== */
:root{
  --bg:#f2f4f7; --bg2:#e9edf2; --panel:#ffffff; --panel2:#f7f9fb; --panel3:#eef2f6;
  --line:#e0e5ec; --line2:#cfd7e2; --text:#121b2a; --text2:#38465b; --muted:#5d6b80;
  --accent:#866000; --accent2:#c79a1e; --accent-bg:#fbf3dc; --accent-ink:#ffffff;
  --ok:#17733f; --ok-bg:#e3f4ea; --warn:#8d5400; --warn-bg:#fdf0da; --bad:#b42c24; --bad-bg:#fbe6e4; --info:#1a5db3; --info-bg:#e3eefc; --vio:#6a40bf; --vio-bg:#efe8fb;
  --track:#e6eaf0; --focus:0 0 0 3px rgba(199,154,30,.35);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --shadow2:0 10px 40px rgba(16,24,40,.18);
  --radius:12px; --radius-sm:8px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  --bar:#121b2a; --bar-ink:#ffffff; --agr:#2f6bd0; --agr-bg:#e6effd; --dsg:#1d7f3a; --dsg-bg:#e2f3e6; --inb:#8a6d00; --inb-bg:#fbf3c9; --outb:#b3261e; --outb-bg:#fbe4e2;
  --cf-PJ:#8c1d2e; --cf-CCT:#c62f3b; --cf-SR:#6e7681; --cf-TACP:#1c1f24; --cf-SERE:#5f7a52; --cf-OTHER:#4b5a70;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f15; --bg2:#0f141c; --panel:#121923; --panel2:#161e2a; --panel3:#1b2431;
    --line:#222c3a; --line2:#2d394a; --text:#e8edf4; --text2:#b4c0d0; --muted:#7f8ca0;
    --accent:#e2b23a; --accent2:#f0c75a; --accent-bg:#2a2412; --accent-ink:#17120a;
    --ok:#3fbf75; --ok-bg:#12261b; --warn:#e8a43c; --warn-bg:#2b2112; --bad:#f06459; --bad-bg:#2d1513; --info:#5aa5ff; --info-bg:#12223a; --vio:#a983ff; --vio-bg:#221a36;
    --track:#202a38; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 20px rgba(0,0,0,.35); --shadow2:0 18px 60px rgba(0,0,0,.6);
    --bar:#263243; --bar-ink:#e8edf4; --agr:#6aa5ff; --agr-bg:#142844; --dsg:#4cc777; --dsg-bg:#11291a; --inb:#ecd04a; --inb-bg:#2c2710; --outb:#ff7a72; --outb-bg:#311614;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --bg2:#0f141c; --panel:#121923; --panel2:#161e2a; --panel3:#1b2431;
  --line:#222c3a; --line2:#2d394a; --text:#e8edf4; --text2:#b4c0d0; --muted:#7f8ca0;
  --accent:#e2b23a; --accent2:#f0c75a; --accent-bg:#2a2412; --accent-ink:#17120a;
  --ok:#3fbf75; --ok-bg:#12261b; --warn:#e8a43c; --warn-bg:#2b2112; --bad:#f06459; --bad-bg:#2d1513; --info:#5aa5ff; --info-bg:#12223a; --vio:#a983ff; --vio-bg:#221a36;
  --track:#202a38; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 20px rgba(0,0,0,.35); --shadow2:0 18px 60px rgba(0,0,0,.6);
  --bar:#263243; --bar-ink:#e8edf4; --agr:#6aa5ff; --agr-bg:#142844; --dsg:#4cc777; --dsg-bg:#11291a; --inb:#ecd04a; --inb-bg:#2c2710; --outb:#ff7a72; --outb-bg:#311614;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px} h4{font-size:13px}
.mono{font-family:var(--mono);font-feature-settings:"zero"}
.muted{color:var(--muted)} .t2{color:var(--text2)}
.small{font-size:12px} .xs{font-size:11px}
.nowrap{white-space:nowrap}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1 1 auto;min-width:0}
.spacer{flex:1}
.gap4{gap:4px}.gap12{gap:12px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.center{text-align:center}.right{text-align:right}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:22px;height:22px}

/* ---------------- shell ---------------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);min-height:64px}
.brand .logo{width:38px;height:38px;border-radius:10px;flex:none;overflow:hidden;display:grid;place-items:center;background:var(--panel3);border:1px solid var(--line)}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand .t1{font-weight:700;font-size:14px;line-height:1.15}
.brand .t2{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav{padding:10px 8px;overflow:auto;flex:1}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 10px 6px}
.nav button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text2);text-align:left;font-weight:500}
.nav button:hover{background:var(--panel3);color:var(--text)}
.nav button.on{background:var(--accent-bg);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav button .cnt{margin-left:auto;font-size:11px;background:var(--panel3);border-radius:999px;padding:1px 7px;color:var(--muted)}
.nav button .cnt.bad{background:var(--bad-bg);color:var(--bad)}
.side .foot{border-top:1px solid var(--line);padding:10px 12px;font-size:11px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:0 20px;height:64px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);min-height:56px}
.top .crumbs{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.top .crumbs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;width:min(360px,40vw)}
.search input{width:100%;padding:8px 12px 8px 34px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.search svg{position:absolute;left:11px;top:9px;color:var(--muted)}
.search .res{position:absolute;top:40px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow2);max-height:420px;overflow:auto;padding:6px}
.search .res button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;text-align:left}
.search .res button:hover,.search .res button.on{background:var(--panel3)}
.me-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer}
.content{padding:20px;max-width:1500px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h .sub{color:var(--muted);font-size:13px;margin-top:2px}
.burger,.btn.burger{display:none}
.banner{padding:8px 20px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line)}
.banner.info{background:var(--info-bg);color:var(--info);border-bottom:1px solid var(--line)}
.banner.demo{background:var(--vio-bg);color:var(--vio);border-bottom:1px solid var(--line)}

/* ---------------- controls ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel3)}
.btn:focus-visible,.input:focus,.select:focus,textarea:focus{outline:none;box-shadow:var(--focus);border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel3)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line2))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line2))}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.xs{padding:2px 7px;font-size:11.5px;border-radius:6px}
.btn.icon{padding:6px;width:32px;height:32px}
.btn.icon.sm{width:28px;height:28px;padding:4px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-bg);border-color:var(--accent2)}
.input,.select,textarea.input{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);min-height:36px}
textarea.input{min-height:90px;resize:vertical;line-height:1.45}
.input.sm,.select.sm{padding:4px 7px;min-height:30px;font-size:12.5px}
.input[readonly]{background:var(--panel2)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2);font-weight:550}
label.f .hint{font-weight:400;color:var(--muted);font-size:11.5px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:12px}
.fgrid .span2{grid-column:span 2}
.fgrid .full{grid-column:1/-1}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:12.5px;color:var(--text2);font-weight:550}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-bg);color:var(--text)}

/* ---------------- cards & data ---------------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card>.hd h3{font-size:14px}
.card>.bd{padding:16px}
.card>.bd.tight{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.02em;font-feature-settings:"tnum"}
.kpi .foot{font-size:12px;color:var(--text2)}
.kpi.accent{border-top:3px solid var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:18px;background:var(--panel3);color:var(--text2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.vio{background:var(--vio-bg);color:var(--vio)}
.pill.acc{background:var(--accent-bg);color:var(--accent)}
.pill.outline{background:transparent;border:1px solid var(--line2)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:5px;background:var(--panel3);color:var(--text2);text-transform:uppercase}
.tag.core5{background:var(--info-bg);color:var(--info)}
.tag.core7{background:var(--vio-bg);color:var(--vio)}
.tag.core3{background:var(--ok-bg);color:var(--ok)}
.tag.mqt{background:var(--accent-bg);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;opacity:.6;margin-bottom:6px}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{position:sticky;top:0;background:var(--panel2);z-index:1;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel2)}
.tbl .num{text-align:right;font-feature-settings:"tnum"}
.scrollx{overflow-x:auto}

/* progress */
.bar{position:relative;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent);transition:width .4s ease}
.bar.ok>i{background:var(--ok)} .bar.info>i{background:var(--info)} .bar.vio>i{background:var(--vio)} .bar.warn>i{background:var(--warn)}
.bar.thin{height:5px}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .top-l{display:flex;align-items:baseline;gap:8px}
.prog .lbl{font-weight:650;font-size:13px}
.prog .pct{margin-left:auto;font-weight:700;font-feature-settings:"tnum"}
.prog .meta{font-size:11.5px;color:var(--muted)}
.ring{--p:0;--c:var(--accent);width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center;flex:none}
.ring>span{width:50px;height:50px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:13px;font-feature-settings:"tnum"}

/* avatars & career-field badges */
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;background:var(--cf-OTHER);flex:none;letter-spacing:.02em}
.av.lg{width:44px;height:44px;font-size:14px}
.av.xl{width:64px;height:64px;font-size:20px}
.cfb{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 7px 2px 5px;border-radius:6px;color:#fff;background:var(--cf-OTHER)}
.cfb .sw{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.75)}
.emblem{width:84px;height:84px;border-radius:16px;display:grid;place-items:center;overflow:hidden;flex:none;background:var(--cf-OTHER);color:#fff;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.emblem img{width:100%;height:100%;object-fit:contain;background:var(--panel)}
.emblem .mono-e{font-weight:800;font-size:22px;letter-spacing:.04em}
.emblem .sub-e{position:absolute;bottom:6px;font-size:9px;letter-spacing:.12em;opacity:.8}
.cf-PJ{background:var(--cf-PJ)!important}.cf-CCT{background:var(--cf-CCT)!important}.cf-SR{background:var(--cf-SR)!important}.cf-TACP{background:var(--cf-TACP)!important}.cf-SERE{background:var(--cf-SERE)!important}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}

/* hero */
.hero{display:flex;gap:18px;align-items:center;padding:18px;flex-wrap:wrap}
.hero>.grow{flex:1 1 320px;min-width:0}
.hero .name{font-size:22px;font-weight:700;letter-spacing:-.015em}
.hero .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--text2);margin-top:6px}
.hero .facts b{color:var(--muted);font-weight:550;margin-right:4px}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:16px;border-top:1px solid var(--line)}
.track{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.track.focus{border-color:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent2)}

/* STS list */
.sts-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sts{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.sts>.sts-sec:first-child>.sh{border-top-left-radius:var(--radius);border-top-right-radius:var(--radius)}
.sts>.sts-sec:last-child,.sts>.sts-sec:last-child>.sb>.srow:last-child{border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius)}
.sts-sec{border-bottom:1px solid var(--line)}
.sts-sec:last-child{border-bottom:0}
.sts-sec>.sh{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:var(--panel2);font-weight:650;user-select:none;position:sticky;top:calc(64px + env(safe-area-inset-top, 0px));z-index:2}
.sts-sec>.sh:hover{background:var(--panel3)}
.sts-sec>.sh .chev{transition:transform .15s}
.sts-sec.closed>.sh .chev{transform:rotate(-90deg)}
.sts-sec.closed>.sb{display:none}
.sts-sec .sh .mini{width:140px}
.srow{display:grid;grid-template-columns:22px 86px minmax(0,1fr) 150px 88px 88px 128px 30px;gap:8px;align-items:center;padding:7px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.srow:hover{background:var(--panel2)}
.srow.hdr{background:transparent;cursor:default;font-weight:650;color:var(--text2);padding-top:10px;padding-bottom:6px;font-size:12.5px}
.srow.hdr:hover{background:transparent}
.srow .id{font-family:var(--mono);font-size:12px;color:var(--text2)}
.srow .ttl{min-width:0}
.srow .ttl .tx{display:block;overflow:hidden;text-overflow:ellipsis}
.srow .codes{display:flex;gap:4px;flex-wrap:wrap}
.srow .code{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px;background:var(--panel3);color:var(--text2)}
.srow .code.req{background:var(--accent-bg);color:var(--accent);font-weight:700}
.srow .dt{font-size:12px;color:var(--text2);font-feature-settings:"tnum"}
.srow .inits{display:flex;gap:3px}
.srow .ini{font-family:var(--mono);font-size:10.5px;min-width:30px;text-align:center;padding:2px 3px;border-radius:4px;border:1px dashed var(--line2);color:var(--muted)}
.srow .ini.on{border-style:solid;color:var(--text);background:var(--panel3)}
.srow .ini.cert.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.srow .ini.bind{border-color:var(--warn)}
.srow.sel{background:var(--accent-bg)}
.st{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);display:inline-block}
.st.prog{border-color:var(--info);background:conic-gradient(var(--info) 50%,transparent 0)}
.st.done{border-color:var(--ok);background:var(--ok)}
.st.cert{border-color:var(--ok);background:var(--ok);box-shadow:0 0 0 2px var(--ok-bg)}
.st.decert{border-color:var(--bad);background:var(--bad-bg)}
.circ{font-family:var(--mono);font-size:11px;border:1.5px solid var(--accent);border-radius:999px;padding:0 4px;color:var(--accent)}
.sts-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 2px}
.sts-legend span{display:inline-flex;gap:6px;align-items:center}
/* transcription grid */
.tgrid .srow{grid-template-columns:24px 86px minmax(0,1fr) 128px 128px 64px 64px 64px minmax(120px,200px)}
.tgrid .srow{cursor:default}
.tgrid input{width:100%;padding:3px 5px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);font-size:12px;min-height:28px}
.tgrid input.ini-in{font-family:var(--mono);text-transform:uppercase;text-align:center}
.tgrid .dirty input{border-color:var(--accent2)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,10,18,.5);z-index:60;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:61;display:flex;flex-direction:column;box-shadow:var(--shadow2);animation:slide .18s ease}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .db{padding:16px 18px;overflow:auto;flex:1}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:18px 0 8px}
.signbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sig{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);display:flex;flex-direction:column;gap:6px;min-height:96px}
.sig .who{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.sig .val{font-family:var(--mono);font-size:18px;font-weight:700}
.sig .val.empty{color:var(--muted);font-size:13px;font-family:var(--font);font-weight:500;padding:0;text-align:left}
.sig .when{font-size:11px;color:var(--muted)}
.req-box{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2);font-size:13px;white-space:pre-wrap}
.codegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.codegrid .c{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.codegrid .c .k{font-size:11px;color:var(--muted)}
.codegrid .c .v{font-family:var(--mono);font-weight:700;font-size:15px}
.codegrid .c .d{font-size:11.5px;color:var(--text2);margin-top:2px}

/* modal */
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:20px;background:rgba(5,10,18,.55);animation:fade .15s}
.modal{min-width:0;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow2);width:min(640px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:pop .16s ease}
.modal.wide{width:min(980px,100%)}
.modal.xwide{width:min(1200px,100%)}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mb{padding:18px;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(6px) scale(.985);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.toasts{position:fixed;top:calc(72px + env(safe-area-inset-top, 0px));right:18px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 36px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow2);font-size:13px;animation:pop .16s}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .art{background:radial-gradient(1200px 600px at 20% 10%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 60%),linear-gradient(160deg,#0d1420,#070a10);color:#e8edf4;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .art .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(180deg,#000 30%,transparent)}
.login .art .unit{display:flex;gap:14px;align-items:center;position:relative}
.login .art .unit .logo{width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;overflow:hidden}
.login .art .unit .logo img{width:100%;height:100%;object-fit:contain}
.login .art h1{font-size:34px;line-height:1.1;max-width:520px;position:relative}
.login .art p{color:#aab6c8;max-width:520px;position:relative}
.login .art .cfs{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.login .form{display:grid;place-items:center;padding:32px;background:var(--bg)}
.login .box{width:min(400px,100%)}
.login .box .card{padding:24px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pinpad button{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:18px;font-weight:600;cursor:pointer}
.pinpad button:hover{background:var(--panel3)}

/* org chart */
.org{display:flex;flex-direction:column;gap:18px}
.org-row{display:grid;gap:16px}
.org-row.lead{grid-template-columns:minmax(0,760px);justify-content:center}
.org-row.secs{grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr))}
.org-row.special{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.ou{border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);min-width:0}
.ou>.oh{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);border-radius:14px 14px 0 0}
.ou>.oh h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ou>.oh .btn.xs{padding:4px 5px}
.ou.team>.oh{gap:2px}
.ou.sec>.oh{background:var(--bar);border-color:var(--bar)}
.ou.sec>.oh h3{color:var(--bar-ink);font-size:14px}
.ou.sec>.oh .btn{color:var(--bar-ink)}
.ou .slots{padding:10px;display:flex;flex-direction:column;gap:8px}
.ou.hq .slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr))}
.ou.special .slots{padding:10px}
.ou.special{border-style:dashed}
.ou.team{box-shadow:none;border-radius:12px;background:var(--panel2)}
.ou.team>.oh{background:transparent;padding:8px 12px}
.sec-lead{padding:12px 12px 0}
.sec-lead .up{text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:650}
.sec-lead .slots{padding:0;display:flex;flex-direction:column;gap:8px}
.teams{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px;padding:12px}
.pad{padding:0 12px 12px}
.slots.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:8px}
.drop{outline:2px dashed var(--accent2)!important;outline-offset:2px}
.pcard{display:flex;align-items:center;gap:9px;padding:8px 10px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;position:relative;min-width:0;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line2)}
.pcard.t-agr::before{background:var(--agr)}.pcard.t-dsg::before{background:var(--dsg)}.pcard.t-in::before{background:var(--inb)}.pcard.t-out::before{background:var(--outb)}
.pcard.t-in{background:var(--inb-bg)}.pcard.t-out{background:var(--outb-bg)}
.pcard:hover{border-color:var(--accent2)}
.pcard[draggable=true]{cursor:grab}
.pcard .pn{font-weight:650;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pb{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pp{display:flex;flex-direction:column;align-items:flex-end;font-size:10px;color:var(--muted);line-height:1.15;flex:none}
.pcard .pp b{font-size:12.5px;color:var(--text)}
.pcard .pbar{position:absolute;left:4px;right:0;bottom:0;height:3px;background:var(--track)}
.pcard .pbar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--accent2)}
.pcard .pbar.ok::after{background:var(--ok)}.pcard .pbar.info::after{background:var(--info)}.pcard .pbar.vio::after{background:var(--vio)}
.pcard .pos{font-family:var(--mono);font-size:11px;font-weight:700;min-width:30px;text-align:center;padding:2px 4px;border-radius:5px;background:var(--panel3);color:var(--text2);flex:none}
.pcard.t-agr .pos{background:var(--agr-bg);color:var(--agr)}.pcard.t-dsg .pos{background:var(--dsg-bg);color:var(--dsg)}
.pcard.vac{border-style:dashed;background:transparent;cursor:default}
.pcard.vac[data-act]{cursor:pointer}
.pcard.vac::before{background:transparent}
.org-tot{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.org-tot>div{padding:6px 14px;display:flex;flex-direction:column;align-items:center;border-left:1px solid var(--line)}
.org-tot>div:first-child{border-left:0}
.org-tot span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
.org-tot b{font-size:18px;line-height:1.2}
.org-tot .agr b{color:var(--agr)}.org-tot .dsg b{color:var(--dsg)}
.org-legend{display:flex;gap:6px;flex-wrap:wrap}
.org-legend .lg{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.org-legend .lg::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--line2)}
.org-legend .agr::before{background:var(--agr)}.org-legend .dsg::before{background:var(--dsg)}.org-legend .in::before{background:var(--inb)}.org-legend .out::before{background:var(--outb)}.org-legend .vac::before{background:transparent;border:1px dashed var(--muted)}
/* chart (paper-style, prints on one landscape page) */
.org-chart-wrap{overflow-x:auto;padding:4px 0 16px}
.sheet.landscape{width:11in;min-height:8.5in;padding:.4in .45in}
.sheet.org-chart{font-family:"Times New Roman",Times,Georgia,serif;color:#000}
.org-chart .chead{display:grid;grid-template-columns:1.6in 1fr 1.6in;align-items:start;border-bottom:3px solid #333;padding-bottom:6px;margin-bottom:12px}
.org-chart .ctot{border:2px solid #000;padding:4px 8px;font-size:11pt;line-height:1.3}
.org-chart .ctitle{text-align:center}
.org-chart .tt{font-size:30pt;font-weight:700;line-height:1.05}
.org-chart .cao{font-size:12pt;font-weight:700;margin-top:2px}
.org-chart .clogo{display:flex;justify-content:flex-end}
.org-chart .clogo img{max-height:.9in;max-width:1.5in}
.org-chart .cbody{display:grid;grid-template-columns:1fr 2.3in 1fr;gap:.18in;align-items:start}
.org-chart .ccol{display:flex;flex-direction:column;gap:.14in;min-width:0}
.org-chart .ccol.mid{padding-top:.05in}
.org-chart .cu{border:1.5px solid #000;background:#fff}
.org-chart .ch{background:#3a3a3a;color:#fff;text-align:center;font-weight:700;font-size:10pt;padding:3px 4px;border-bottom:1.5px solid #000}
.org-chart .ch.big{font-size:13pt;letter-spacing:.04em;padding:4px}
.org-chart .cb{border-top:1.5px solid #000;min-height:.5in;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:9.5pt;line-height:1.25;padding:2px 4px;background:#2fa043;color:#000}
.org-chart .ch+.cb,.org-chart .ch+.cgrid>.cb.r0{border-top:0}
.org-chart .cb.agr{background:#4a86e8}.org-chart .cb.dsg{background:#2fa043}.org-chart .cb.in{background:#f5e93a}.org-chart .cb.out{background:#e53935}.org-chart .cb.oth{background:#cfd6dd}.org-chart .cb.vac{background:#e9edf0;color:#444}
.org-chart .cb.blank{background:#fff}
.org-chart .cgrid{display:grid}
.org-chart .cgrid .cb{border-left:1.5px solid #000}
.org-chart .cgrid .cb.c0{border-left:0}
.org-chart .csec{display:flex;flex-direction:column;gap:.12in}
.org-chart .clead{display:flex;justify-content:center}
.org-chart .clead .cu{width:2.3in}
.org-chart .clegend{border:1.5px solid #000;display:flex;flex-direction:column;align-self:center;width:1.2in}
.org-chart .clegend .cb{min-height:.24in;font-weight:700;font-size:9pt}
.org-chart .clegend .cb:first-child{border-top:0}
.org-unassigned{border:1px dashed var(--line2);border-radius:12px;padding:12px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.cal .dow{padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel2);border-bottom:1px solid var(--line);font-weight:700}
.cal .day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--panel2);color:var(--muted)}
.cal .day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:999px}
.cal .dn{font-size:12px;font-weight:650;width:24px;height:24px;display:grid;place-items:center}
.ev{font-size:11px;padding:2px 6px;border-radius:5px;background:var(--info-bg);color:var(--info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--info);cursor:pointer}
.ev.cert{background:var(--bad-bg);color:var(--bad);border-left-color:var(--bad)}
.ev.target{background:var(--accent-bg);color:var(--accent);border-left-color:var(--accent)}
.ev.review{background:var(--vio-bg);color:var(--vio);border-left-color:var(--vio)}
.ev.school{background:var(--ok-bg);color:var(--ok);border-left-color:var(--ok)}
.ev.deploy{background:var(--warn-bg);color:var(--warn);border-left-color:var(--warn)}
.ev.more{background:none;border-left:0;color:var(--muted)}
.agenda .it{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.agenda .it:last-child{border-bottom:0}
.agenda .dd{width:48px;text-align:center;flex:none}
.agenda .dd .m{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.06em}
.agenda .dd .d{font-size:20px;font-weight:700;line-height:1}
.agenda .ev{flex:none;max-width:none}

/* targets board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:120px}
.lane>.lh{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.lane>.lh .ring-s{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.lane>.lb{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.todo{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.todo.done .tx{text-decoration:line-through;color:var(--muted)}
.todo .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-size:13px}
.todo .due{font-size:11px;color:var(--muted)}
.todo .due.late{color:var(--bad);font-weight:700}
.todo .acts{opacity:0;display:flex;gap:2px}
.todo:hover .acts{opacity:1}
.addline{display:flex;gap:6px}
.addline input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:4px 6px 4px 11px;font-size:12.5px;background:var(--panel)}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px}

/* EPB */
.epb-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.epb-item .eh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.epb-item .et{white-space:pre-wrap;margin-top:8px;font-size:13.5px;line-height:1.55}
.mpa-ExecutingtheMission{background:var(--info-bg)!important;color:var(--info)!important}
.mpa-LeadingPeople{background:var(--ok-bg)!important;color:var(--ok)!important}
.mpa-ManagingResources{background:var(--warn-bg)!important;color:var(--warn)!important}
.mpa-ImprovingtheUnit{background:var(--vio-bg)!important;color:var(--vio)!important}

/* certs */
.cert-card{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);align-items:flex-start}
.cert-card .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--panel3);flex:none}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumb{width:56px;height:56px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;overflow:hidden;cursor:pointer;font-size:10px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.dropzone{border:2px dashed var(--line2);border-radius:12px;padding:20px;text-align:center;color:var(--muted);cursor:pointer}
.dropzone.over{border-color:var(--accent2);background:var(--accent-bg)}
.matrix td.cell{text-align:center;font-size:11.5px;font-weight:650}
.matrix td.cell.ok{color:var(--ok)}.matrix td.cell.warn{color:var(--warn);background:var(--warn-bg)}.matrix td.cell.bad{color:var(--bad);background:var(--bad-bg)}

/* reference */
.ref-grid{display:grid;gap:16px;grid-template-columns:220px minmax(0,1fr);align-items:start}
.ref-grid>*{min-width:0}
.ref-nav{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.card>.bd.tight{overflow-x:auto}
.ref-nav button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--text2)}
.ref-nav button.on,.ref-nav button:hover{background:var(--panel3);color:var(--text)}
details.acc{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
details.acc>summary{padding:11px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details.acc[open]>summary::before{transform:rotate(45deg)}
details.acc>.ad{padding:0 14px 14px;font-size:13.5px;color:var(--text2)}
.gloss dt{font-weight:650;margin-top:10px}
.gloss dd{margin:2px 0 0;color:var(--text2)}

/* 623A print sheet */
.print-root{display:none}
.sheet{background:#fff;color:#000;width:8.5in;min-height:11in;margin:0 auto 20px;padding:.5in .5in .45in;font-family:Arial,Helvetica,sans-serif;font-size:10pt;position:relative;box-shadow:0 2px 18px rgba(0,0,0,.25)}
.sheet.f623{padding:0;height:11in;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.f623 .box{position:absolute;left:.5in;top:.397in;width:7.5in;height:10.042in;border:.75pt solid #000;display:flex;flex-direction:column}
.f623 .ttl{height:.469in;flex:none;border-bottom:.75pt solid #000;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:10pt;line-height:12pt;padding-top:3.5pt}
.f623 .body{flex:1;min-height:0;overflow:hidden;padding:.1in .12in}
.f623 .ent{padding:0 0 .14in;break-inside:avoid}
.f623 .eh{font-weight:700;font-size:10pt}
.f623 .c{white-space:pre-wrap;font-size:10pt;line-height:1.32;margin-top:2px;overflow-wrap:anywhere}
.f623 .sg{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 8px;margin-top:5px;font-size:8.5pt}
.f623 .sg .ln{display:inline-flex;align-items:flex-end;gap:4px;min-width:1.5in;border-bottom:.75pt solid #000;padding:0 4px 1px;min-height:.22in;margin-right:12px;font-size:10pt}
.f623 .sg img{max-width:.8in;max-height:.3in;display:block}
.f623 .sg .ts{font-size:7pt;font-weight:400}
.f623 .nm{height:.371in;flex:none;border-top:.75pt solid #000;padding:1px 3px 0;display:flex;flex-direction:column}
.f623 .nm .lbl{font-size:7pt;line-height:8pt}
.f623 .nm .fv{font-size:10pt;padding-left:4px;line-height:13pt}
.f623 .foot{position:absolute;left:.52in;right:.5in;top:10.455in;display:flex;justify-content:space-between;align-items:flex-start;font-size:8pt;line-height:9.9pt}
.f623 .foot .pv{font-size:6.9pt}
.f623 .foot .pg{font-size:7pt;padding-top:1px}
.sheet.sts-print{font-size:8.5pt}
.sts-print table{width:100%;border-collapse:collapse}
.sts-print th,.sts-print td{border:1px solid #000;padding:2px 3px;vertical-align:top}
.sts-print th{font-size:7pt;background:#eee}
.sts-print .h1 td{background:#ddd;font-weight:700}
.sts-print .c{text-align:center;font-family:Consolas,monospace;font-size:7.5pt}
.preview-pages{background:var(--bg2);padding:20px;border-radius:10px;max-height:70vh;overflow:auto}

/* responsive */
@media (max-width:1200px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-dash{grid-template-columns:minmax(0,1fr)}
  .srow{grid-template-columns:22px 70px minmax(0,1fr) 110px 82px 82px 110px 28px}
}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .ref-grid{grid-template-columns:minmax(0,1fr)}
  .ref-nav{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .ref-nav button{white-space:nowrap;flex:none;border:1px solid var(--line)}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow2)}
  .app.nav-open .side{transform:none}
  .burger,.btn.burger{display:inline-flex}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .login{grid-template-columns:1fr}
  .login .art{min-height:280px;padding:28px}
  .board{grid-template-columns:1fr}
  .srow{grid-template-columns:20px 64px minmax(0,1fr) 92px 28px}
  .srow .c-codes,.srow .c-start,.srow .c-inits{display:none}
  .tgrid .srow{grid-template-columns:20px 64px minmax(0,1fr) 120px 120px 56px 56px 56px}
  .tgrid .srow .c-notes{display:none}
  .search{width:auto;flex:1}
  .content{padding:16px}
  .top{padding:0 14px}
}
@media (max-width:600px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:22px}
  .sts.tgrid{overflow-x:auto}
  .sts.tgrid .srow{min-width:600px}
  .signbox{grid-template-columns:1fr}
  .fgrid .span2{grid-column:1/-1}
  .modal-wrap{padding:10px}
  .kv{grid-template-columns:1fr}
  .cal .day{min-height:64px}
  .cal .ev{display:none}
  .cal .day .cnt-dot{display:block}
  .sts:not(.tgrid) .srow{grid-template-columns:18px 58px minmax(0,1fr) 22px!important;padding-left:10px!important;padding-right:10px}
  .srow .dt{display:none}
  .sts-sec>.sh .mini,.sts-sec>.sh .nowrap{display:none}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .top [data-act=syncNow]{display:none}
  .teams{grid-template-columns:minmax(0,1fr)!important}
  .org-tot>div{padding:6px 10px}
  .search{flex:1;min-width:0;width:auto}
  .search input{padding-left:30px;font-size:16px}
  .search .res{position:fixed;left:8px;right:8px;top:calc(56px + env(safe-area-inset-top, 0px))}
  .hero{padding:14px}
  .tracks{padding:12px;gap:10px}
  .me-chip .nm{display:none}
  .top .crumbs{display:none}
}

/* print */
@media print{
  @page{size:letter;margin:0}
  body{background:#fff}
  body.printing>*:not(.print-root){display:none!important}
  body.printing .print-root{display:block!important}
  .print-root,.print-root *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet{box-shadow:none;margin:0;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
  .sheet.landscape{page:landscape;width:11in;min-height:8.5in;height:8.5in;overflow:hidden}
}
@page landscape{size:letter landscape;margin:0}

/* ---------- sensitivity label (CUI marking) ---------- */
body{--mk-h:0px}
body.mk-on{--mk-h:18px;padding-top:18px}
#mk-bar{position:fixed;top:0;left:0;right:0;height:18px;z-index:300;background:#502b85;color:#fff;font:700 11px/18px Inter,Arial,Helvetica,sans-serif;letter-spacing:.16em;text-align:center;user-select:none}
.side{top:var(--mk-h);height:calc(100vh - var(--mk-h))}
.top{top:calc(var(--mk-h) + env(safe-area-inset-top,0px))}
.sts-sec>.sh{top:calc(64px + var(--mk-h) + env(safe-area-inset-top,0px))}
.ref-nav{top:calc(76px + var(--mk-h))}
.toasts{top:calc(72px + var(--mk-h) + env(safe-area-inset-top,0px))}
.login{min-height:calc(100vh - var(--mk-h))}
.sens-btn{gap:6px;max-width:250px;padding-inline:10px}
.sens-btn .shield{flex:none}
.sens-btn .sl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600}
.sens-pop{position:fixed;z-index:120;width:310px;max-width:calc(100vw - 16px);max-height:calc(100vh - 110px);overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow2);padding:6px}
.sens-pop .sp-h{display:flex;flex-direction:column;gap:1px;padding:8px 10px 6px}
.sens-pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;padding:8px 10px;border-radius:8px;text-align:left;font:inherit;font-size:13.5px;cursor:pointer}
.sens-pop button:hover:not(:disabled),.sens-pop button:focus-visible{background:var(--panel2);outline:none}
.sens-pop .ck{width:18px;display:inline-flex;justify-content:center;flex:none}
.sens-pop .sp-g>.i:last-child{transition:transform .15s}
.sens-pop .sp-g.open>.i:last-child{transform:rotate(90deg)}
.sens-pop .sp-items{padding:0 0 4px 22px}
.sens-pop .sp-i:disabled{cursor:default;opacity:.9}
.sens-pop .sp-i.on{font-weight:650;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sens-pop .sp-sep{height:1px;background:var(--line);margin:6px 4px}
.sheet .mk{font:700 10pt Arial,Helvetica,sans-serif;color:#000;letter-spacing:.04em;text-align:center}
.sheet .mk.scr{margin:-.25in 0 .12in}
.sheet .mk-di.scr+.mk.scr,.sheet>.mk.scr:last-child{margin:.12in 0 -.2in}
.sheet .mk-di{font:6.5pt/1.25 Arial,Helvetica,sans-serif;color:#000;margin-top:.15in}
.sheet.landscape .mk,.f623 .mk{position:absolute;left:0;right:0}
.sheet.landscape .mk-t{top:.13in}
.sheet.landscape .mk-b{bottom:.12in}
.sheet.landscape .mk-di{position:absolute;right:.45in;bottom:.08in;margin:0}
.f623 .mk-t{top:.17in}
.f623 .mk-b{top:10.49in}
.f623 .foot .pg{text-align:right;font-size:7pt;line-height:8pt}
.f623 .foot .pg .di{font-size:6.3pt;line-height:7.4pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:3.35in}
@media (max-width:900px){.sens-btn .sl{display:none}.sens-btn{padding-inline:8px}}
@media print{body.mk-on{padding-top:0}#mk-bar,.sens-pop{display:none!important}}

/* ---------- clickable progress tiles, select mode ---------- */
.track.clk{cursor:pointer;transition:border-color .12s,background .12s}
.track.clk:hover{border-color:var(--accent2);background:var(--panel3)}
.track.clk:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.track.sel{border-color:var(--accent2);box-shadow:inset 0 0 0 2px var(--accent2)}
.srow .pick{width:18px;height:18px;border:2px solid var(--muted);border-radius:5px;display:inline-grid;place-items:center;color:#fff;flex:none}
.srow .pick.on{background:var(--accent2);border-color:var(--accent2)}
.srow .pick .i{width:13px;height:13px}
.srow.sel{background:color-mix(in srgb,var(--accent2) 10%,transparent)}

/* ---------- fit on laptop screens at 125-150% scaling ---------- */
@media (max-width:1440px){.g-dash{grid-template-columns:minmax(0,1fr)}}
@media (max-height:820px) and (min-width:981px){
  .brand{min-height:54px;padding:10px 16px}
  .nav{padding:6px 8px}
  .nav .sec{padding:8px 10px 3px}
  .nav button{padding:5px 10px}
  .side .foot{padding:6px 12px}
}
.srow.ctx{opacity:.62}
/* multi-item sign-off / transcription action bar: sticks under the top bar while the list scrolls */
.selbar{position:sticky;top:calc(64px + var(--mk-h,0px) + env(safe-area-inset-top,0px));z-index:15;background:var(--panel);border:1px solid var(--accent2);border-radius:12px;box-shadow:var(--shadow2);padding:8px 12px;margin:0 0 12px}
.sts-sec>.sh{top:calc(64px + var(--mk-h,0px) + var(--selbar-h,0px) + env(safe-area-inset-top,0px))}
.sts.picking .srow{user-select:none;-webkit-user-select:none}
.pnav button{min-width:30px;font-size:18px;line-height:1}
@media (max-width:600px){.selbar>.xs.muted{display:none}.selbar{padding:6px 8px}}

</style>

<script>
/* src/js/00_util.js */
/* =====================================================================
 * Utilities: DOM, escaping, dates, icons, dialogs, files
 * ===================================================================== */

function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function attr(s) { return esc(s); }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function pct(n, d) { return d ? Math.round((n / d) * 1000) / 10 : 0; }
function pctRound(n, d) { return d ? Math.floor((n / d) * 100) : 0; }
function plural(n, w, p) { return n + ' ' + (n === 1 ? w : (p || w + 's')); }
function debounce(fn, ms) { var t; return function () { var a = arguments, s = this; clearTimeout(t); t = setTimeout(function () { fn.apply(s, a); }, ms); }; }
function uidLocal() { return 'x' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function byKey(list, k) { var m = {}; (list || []).forEach(function (r) { m[r[k]] = r; }); return m; }
function sortBy(list, fn) { return list.slice().sort(function (a, b) { var x = fn(a), y = fn(b); return x < y ? -1 : x > y ? 1 : 0; }); }
function naturalCmp(a, b) {
  var ax = String(a).split(/(\d+)/), bx = String(b).split(/(\d+)/);
  for (var i = 0; i < Math.max(ax.length, bx.length); i++) {
    var x = ax[i] || '', y = bx[i] || '';
    if (x === y) continue;
    var nx = parseInt(x, 10), ny = parseInt(y, 10);
    if (!isNaN(nx) && !isNaN(ny)) return nx - ny;
    return x < y ? -1 : 1;
  }
  return 0;
}

/* ---------------- dates (local, ISO yyyy-mm-dd) ---------------- */
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function today() { return isoOf(new Date()); }

var RECORD_FIELDS_TEXT = ['start','complete','notes','circled','formal','decertNote'];
var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
var MAX_TEXT = 20000;

function ApiError(code, message) { this.code = code; this.message = message; }

function createCore(store) {
  var S = store;

  /* ---------------- helpers ---------------- */
  function err(code, msg) { throw new ApiError(code, msg); }
  function str(v, max) {
    if (v === null || v === undefined) return '';
    v = String(v);
    if (v.length > (max || 2000)) v = v.substring(0, max || 2000);
    return v;
  }
  function yn(v) { return (v === true || v === 'Y' || v === 'y' || v === 'true' || v === 1) ? 'Y' : ''; }
  function isDate(v) { return v === '' || DATE_RE.test(v); }
  function initials(v) {
    v = str(v, 8).toUpperCase().replace(/[^A-Z0-9.\-\/ ]/g, '').trim();
    return v.substring(0, 6);
  }
  function rows(t) { return S.all(t); }
  var IDX = {}; // per-request id index (invalidated on writes)
  function byId(t, id) {
    if (!id) return null;
    if (S.get) return S.get(t, id);
    if (!IDX[t]) { IDX[t] = {}; var r = rows(t); for (var i = 0; i < r.length; i++) IDX[t][r[i].id] = r[i]; }
    return IDX[t][id] || null;
  }
  var ID_RE = /^[A-Za-z0-9._:-]{1,80}$/;
  function safeId(v) { v = str(v, 80); return ID_RE.test(v) ? v : ''; }
  function safeIdList(v) { return str(v, 4000).split(',').map(function (x) { return x.trim(); }).filter(function (x) { return ID_RE.test(x); }).join(','); }
  function nowMs() { return S.nowMs ? S.nowMs() : Date.now(); }
  function posCode(v) { v = str(v, 12).toUpperCase().replace(/[^A-Z0-9-]/g, ''); return v.substring(0, 8); }
  var DUTY = ['AGR', 'DSG', 'AD', 'TR', 'CIV'];
  function dutyStatus(v) { v = str(v, 12).toUpperCase().replace(/[^A-Z]/g, ''); if (v === 'ACTIVEDUTY') v = 'AD'; if (v === 'CIVILIAN') v = 'CIV'; return DUTY.indexOf(v) >= 0 ? v : ''; }
  function slotList(v) { var seen = {}; return str(v, 600).split(',').map(posCode).filter(function (x) { if (!x || seen[x]) return false; seen[x] = 1; return true; }).slice(0, 40).join(','); }
  function settingsMap() {
    var m = {}, r = rows('settings');
    for (var i = 0; i < r.length; i++) m[r[i].id] = r[i].value;
    return m;
  }
  function setting(k, dflt) {
    var r = byId('settings', k);
    return r ? r.value : (dflt === undefined ? '' : dflt);
  }
  function fullName(p) { return p ? ((p.rank ? p.rank + ' ' : '') + p.first + ' ' + p.last).trim() : ''; }
  function audit(me, action, target, detail) {
    try {
      S.append('audit', { id: S.newId(), ts: S.now(), by: me ? me.id : '', byName: me ? fullName(me) : 'system', action: action, target: target || '', detail: str(detail, 1000) });
    } catch (e) { /* audit must never break a write */ }
  }

  /* -------------- versioned writes -------------- */
  var pending = null; // {v, out:{table:[rows]}, deleted:[]}
  function beginWrite() {
    pending = { v: S.bumpVersion(), out: {}, deleted: [] };
  }
  function put(table, row) {
    IDX[table] = null; SUBS = null;
    row._v = String(pending.v);
    if (TABLES[table].indexOf('updatedAt') >= 0) row.updatedAt = S.now();
    S.upsert(table, row);
    (pending.out[table] = pending.out[table] || []).push(row);
    return row;
  }
  function del(table, id) {
    IDX[table] = null; SUBS = null;
    S.remove(table, id);
    S.upsert('deleted', { id: table + ':' + id, table: table, rowId: id, _v: String(pending.v) });
    pending.deleted.push({ table: table, rowId: id });
  }
  function result(extra) {
    var res = { ok: true, v: pending ? pending.v : S.version() };
    if (pending) { res.rows = {}; res.deleted = pending.deleted; }
    if (pending) for (var t in pending.out) res.rows[t] = pending.out[t].filter(function (r) { return !CUR_ME || visible(CUR_ME, t, r); }).map(function (r) { return publicRow(t, r, CUR_ME); });
    if (extra) for (var k in extra) res[k] = extra[k];
    pending = null;
    return res;
  }
  function publicRow(t, r, viewer) {
    var o;
    if (t === 'people') {
      o = {};
      for (var k in r) if (k !== 'pinHash' && k !== 'pinSalt') o[k] = r[k];
      if (viewer && !canSeePrivate(viewer, r.id)) o.notes = ''; // "Notes (supervisor)"
      return o;
    }
    if (t === 'records' && viewer && (r.notes || r.decertNote) && !canSeePrivate(viewer, r.personId)) {
      o = {}; for (var k2 in r) o[k2] = r[k2];
      o.notes = ''; o.decertNote = '';
      return o;
    }
    return r;
  }

  /* -------------- sessions / auth -------------- */
  function hashPin(pin, salt) { return S.hash(salt + '|' + pin + '|cfetp'); }
  function newToken() { return S.newId() + S.newId(); }
  var SESSION_MAX_MS = 12 * 3600 * 1000;
  function session(token) {
    if (!token) err('AUTH', 'Please sign in.');
    var s = S.cacheGet('tok:' + token);
    if (!s) err('AUTH', 'Your session expired. Please sign in again.');
    var me = byId('people', s.pid);
    if (!me || me.archived === 'Y') err('AUTH', 'Account not available.');
    if (s.salt !== undefined && s.salt !== me.pinSalt) { S.cacheRemove('tok:' + token); err('AUTH', 'Your PIN was changed. Please sign in again.'); }
    if (s.t0 && nowMs() - s.t0 > SESSION_MAX_MS) { S.cacheRemove('tok:' + token); err('AUTH', 'Your session expired. Please sign in again.'); }
    S.cachePut('tok:' + token, s, 21600);
    return me;
  }
  function newSession(p) {
    var token = newToken();
    S.cachePut('tok:' + token, { pid: p.id, t0: nowMs(), salt: p.pinSalt }, 21600);
    return token;
  }
  function role(me) { return ROLES[me.role] || 1; }
  function isAdmin(me) { return me.role === 'admin'; }
  function isSup(me) { return role(me) >= 2; }
  function readOnlyMode() { return setting('readOnly') === 'Y'; }
  var SUBS = null;
  function subordinates(me) {
    // recursive supervisor chain (memoized per request)
    if (SUBS && SUBS.id === me.id) return SUBS.set;
    var all = rows('people'), set = {}, frontier = [me.id], guard = 0;
    while (frontier.length && guard++ < 50) {
      var next = [];
      for (var i = 0; i < all.length; i++) {
        if (frontier.indexOf(all[i].supervisorId) >= 0 && !set[all[i].id] && all[i].id !== me.id) { set[all[i].id] = true; next.push(all[i].id); }
      }
      frontier = next;
    }
    SUBS = { id: me.id, set: set };
    return set;
  }
  function inScope(me, person) {
    if (!person) return false;
    if (isAdmin(me)) return true;
    if (person.id === me.id) return true;
    if (!isSup(me)) return false;
    if (setting('supScope', 'all') === 'all') return true;
    return !!subordinates(me)[person.id];
  }
  function canManage(me, person) { // supervisor-level authority over a person
    if (isAdmin(me)) return true;
    if (!person || person.id === me.id) return false;
    if (subordinates(me)[person.id]) return true; // anyone in my supervision chain
    if (!isSup(me)) return false;
    if (person.role === 'admin') return false; // admins are managed by admins (or their own supervision chain)
    return inScope(me, person);
  }
  function canSeePerson(me, person) {
    if (!person) return false;
    if (isAdmin(me) || person.id === me.id) return true;
    if (subordinates(me)[person.id]) return true;
    if (isSup(me) && inScope(me, person)) return true;
    return setting('membersSeeAll', 'Y') === 'Y';
  }
  function canSeePrivate(me, personId) { // certs, 623, targets, epb, files
    if (isAdmin(me) || personId === me.id) return true;
    var p = byId('people', personId);
    if (p && subordinates(me)[p.id]) return true;
    return isSup(me) && inScope(me, p);
  }
  function assertWritable(me) {
    if (readOnlyMode() && !isAdmin(me)) err('LOCKED', 'The tracker is in read-only mode. An admin must unlock it.');
  }

  /* -------------- visibility filters -------------- */
  function visible(me, table, r) {
    switch (table) {
      case 'people': return canSeePerson(me, r);
      case 'org': case 'settings': return true;
      case 'records': return canSeePerson(me, byId('people', r.personId));
      case 'events':
        if (!r.personIds || r.personIds === '*' || r.createdBy === me.id || isSup(me)) return true;
        return String(r.personIds).split(',').some(function (id) { return id && (id === me.id || canSeePrivate(me, id)); });
      case 'certs': case 'targets': return canSeePrivate(me, r.personId);
      case 'e623': return canSeePrivate(me, r.personId) || ((me.isTrainer === 'Y' || me.isCertifier === 'Y') && canSeePerson(me, byId('people', r.personId)));
      case 'files': return r.kind === 'logo' || r.kind === 'catalog' || canSeePrivate(me, r.personId) || (r.kind === 'sig' && canSeePerson(me, byId('people', r.personId))); // signatures appear on printed 623A sheets
      case 'epb': // EPB notes stay inside the supervision chain
        if (isAdmin(me) || r.authorId === me.id) return true;
        if (r.personId === me.id) return r.visibility !== 'sup';
        return !!subordinates(me)[r.personId];
    }
    return false;
  }

  /* -------------- ops -------------- */
  var ops = {};

  ops.status = function () {
    var admins = rows('people').filter(function (p) { return p.role === 'admin' && p.archived !== 'Y'; });
    return { ok: true, initialized: admins.length > 0, unitName: setting('unitName', ''), unitShort: setting('unitShort', ''), logoFile: setting('unitLogo', ''), version: CORE_VERSION, needsSetupCode: S.needsSetupCode(), sensLabel: setting('sensLabel', 'cui'), sensLdc: setting('sensLdc', '') };
  };

  ops.setupAdmin = function (a) {
    var st = ops.status();
    if (st.initialized) err('FORBIDDEN', 'Already set up.');
    if (S.needsSetupCode() && str(a.setupCode).trim().toUpperCase() !== String(S.setupCode()).toUpperCase()) err('FORBIDDEN', 'Setup code is not correct. Find it on the Config tab of the Google Sheet.');
    var ad = a.admin || {};
    if (!ad.last || !ad.first) err('INVALID', 'Name is required.');
    validatePin(ad.pin);
    beginWrite();
    put('settings', { id: 'unitName', value: str(a.unitName || '123d Special Tactics Squadron', 120) });
    put('settings', { id: 'unitShort', value: str(a.unitShort || '123 STS', 30) });
    put('settings', { id: 'membersSeeAll', value: 'Y' });
    put('settings', { id: 'supScope', value: 'all' });
    put('settings', { id: 'completionRule', value: 'standard' });
    put('settings', { id: 'reviewDays', value: '90' });
    var salt = S.newId();
    var p = {
      id: S.newId(), username: normUser(ad.username || (ad.last + (ad.first || '').charAt(0))), rank: str(ad.rank, 12), last: str(ad.last, 40), first: str(ad.first, 40), mi: str(ad.mi, 2),
      initials: initials(ad.initials || ((ad.first || '').charAt(0) + (ad.last || '').charAt(0))), catalogId: safeId(ad.catalogId), skill: /^[1-9]$/.test(str(ad.skill, 1)) ? str(ad.skill, 1) : (ad.catalogId ? '3' : ''), dutyTitle: str(ad.dutyTitle, 60),
      orgUnit: '', position: '', billet: '', dutyStatus: dutyStatus(ad.dutyStatus), orderInUnit: '0', supervisorId: '', status: 'Active', role: 'admin', isTrainer: 'Y', isCertifier: 'Y', ugtStart: '', ugtLevel: '', email: '', phone: '', notes: '',
      locked: '', lockedBy: '', lockedAt: '', pinHash: hashPin(ad.pin, salt), pinSalt: salt, pinSet: 'Y', sigFile: '', archived: '', createdAt: S.now()
    };
    put('people', p);
    seedOrg();
    audit(p, 'setup', 'unit', 'Tracker initialized');
    S.clearSetupCode();
    return result();
  };

  function seedOrg() {
    if (rows('org').length) return;
    // Default layout follows the team task org: HQ, two sections with a section lead and two position columns each,
    // plus Inbound / Outbound. Element names and position codes are editable in Task Org.
    var hq = S.newId(), a = S.newId(), b = S.newId();
    var units = [
      { id: hq, name: 'Team HQ', type: 'leadership', parentId: '', order: '0', slots: 'A01,A02,A03' },
      { id: a, name: 'Alpha', type: 'section', parentId: '', order: '1', slots: 'A12' },
      { id: S.newId(), name: 'A Team', type: 'fireteam', parentId: a, order: '0', slots: 'A1,A2,A3,A4,A5' },
      { id: S.newId(), name: 'B Team', type: 'fireteam', parentId: a, order: '1', slots: 'B1,B2,B3,B4,B5' },
      { id: b, name: 'Bravo', type: 'section', parentId: '', order: '2', slots: 'A22' },
      { id: S.newId(), name: 'C Team', type: 'fireteam', parentId: b, order: '0', slots: 'C1,C2,C3,C4,C5' },
      { id: S.newId(), name: 'D Team', type: 'fireteam', parentId: b, order: '1', slots: 'D1,D2,D3,D4,D5' },
      { id: S.newId(), name: 'Inbound', type: 'special', parentId: '', order: '3', slots: '' },
      { id: S.newId(), name: 'Outbound', type: 'special', parentId: '', order: '4', slots: '' },
      { id: S.newId(), name: 'Attached / Other', type: 'special', parentId: '', order: '5', slots: '' }
    ];
    units.forEach(function (u) { put('org', u); });
  }

  function normUser(u) { return str(u, 40).toLowerCase().replace(/[^a-z0-9._-]/g, ''); }
  function validatePin(pin) {
    pin = str(pin, 20);
    if (!/^\d{6,8}$/.test(pin)) err('INVALID', 'PIN must be 6 to 8 digits.');
    if (/^(\d{1,3})\1+$/.test(pin) || pin.split('').filter(function (c, i, s) { return s.indexOf(c) === i; }).length < 3 || '0123456789'.indexOf(pin) >= 0 || '9876543210'.indexOf(pin) >= 0) err('INVALID', 'Choose a less predictable PIN (no repeats like 121212, runs like 123456, or only one or two different digits).');
  }

  ops.login = function (a) {
    var u = normUser(a.username), pin = str(a.pin, 20);
    if (!u || !pin) err('INVALID', 'Enter your username and PIN.');
    var key = 'fail:' + u, keyD = 'faild:' + u, fails = S.cacheGet(key) || { n: 0 }, failsD = S.cacheGet(keyD) || { n: 0 };
    if (failsD.n >= 15) err('RATE', 'This account is locked after repeated failed sign-ins. Ask an admin to reset your PIN.');
    if (fails.n >= 5) err('RATE', 'Too many attempts. Wait 15 minutes or ask an admin to reset your PIN.');
    var p = null, all = rows('people');
    for (var i = 0; i < all.length; i++) if (all[i].username === u && all[i].archived !== 'Y') { p = all[i]; break; }
    if (!p || p.pinSet !== 'Y' || hashPin(pin, p.pinSalt) !== p.pinHash) {
      fails.n++; S.cachePut(key, fails, 900);
      if (p) { failsD.n++; S.cachePut(keyD, failsD, 21600); audit(null, 'login.fail', p.id, 'Failed sign-in for ' + u + ' (' + failsD.n + ')'); }
      err('AUTH', 'Username or PIN is not correct.');
    }
    S.cacheRemove(key); S.cacheRemove(keyD);
    var v = S.version();
    var token = newSession(p);
    audit(p, 'login', p.id, '');
    CUR_ME = p;
    var data = snapshot(p);
    return { ok: true, token: token, meId: p.id, data: data, v: v, mustChangePin: p.pinTemp === 'Y' };
  };

  ops.logout = function (a, me, token) { S.cacheRemove('tok:' + token); return { ok: true }; };

  function snapshot(me) {
    var data = {};
    SYNC_TABLES.forEach(function (t) {
      data[t] = rows(t).filter(function (r) { return visible(me, t, r); }).map(function (r) { return publicRow(t, r, me); });
    });
    return data;
  }
  ops.bootstrap = function (a, me) { var v = S.version(); return { ok: true, meId: me.id, data: snapshot(me), v: v }; };

  ops.sync = function (a, me) {
    var since = Number(a.since || 0), v = S.version();
    if (since >= v) return { ok: true, v: v, rows: {}, deleted: [] };
    var tv = S.tableVersions ? S.tableVersions() : null;
    var changed = function (t) { return !tv || tv[t] === undefined || Number(tv[t]) > since; };
    // access-affecting changes (roles, supervisors, visibility settings) or pruned history: client reloads everything
    var acl = byId('settings', 'aclV'), pruned = byId('settings', 'pruneV');
    if ((acl && Number(acl._v || 0) > since) || (pruned && since < Number(pruned.value || 0))) return { ok: true, v: v, reload: true, rows: {}, deleted: [] };
    var out = {}, dels = [];
    SYNC_TABLES.forEach(function (t) {
      if (!changed(t)) return;
      var list = [];
      rows(t).forEach(function (r) {
        if (Number(r._v || 0) <= since) return;
        if (visible(me, t, r)) list.push(publicRow(t, r, me));
        else dels.push({ table: t, rowId: r.id }); // changed and no longer visible to me
      });
      if (list.length) out[t] = list;
    });
    if (changed('deleted')) rows('deleted').forEach(function (d) { if (Number(d._v || 0) > since) dels.push({ table: d.table, rowId: d.rowId }); });
    return { ok: true, v: v, rows: out, deleted: dels, meRole: me.role };
  };
  function markAcl() { put('settings', { id: 'aclV', value: String(nowMs()) }); }
  function pruneTombstones() {
    var t = rows('deleted');
    if (t.length < 3000) return;
    var sorted = t.slice().sort(function (x, y) { return Number(x._v) - Number(y._v); });
    var cut = sorted.slice(0, sorted.length - 1500), maxV = 0;
    cut.forEach(function (d) { maxV = Math.max(maxV, Number(d._v || 0)); S.remove('deleted', d.id); });
    IDX.deleted = null;
    put('settings', { id: 'pruneV', value: String(maxV) });
  }

  /* ---------- people ---------- */
  var PERSON_ADMIN_FIELDS = ['username','rank','last','first','mi','initials','catalogId','skill','dutyTitle','orgUnit','position','billet','dutyStatus','orderInUnit','supervisorId','status','role','isTrainer','isCertifier','ugtStart','ugtLevel','email','phone','notes','archived'];
  var PERSON_SUP_FIELDS = ['rank','skill','dutyTitle','orgUnit','position','billet','dutyStatus','orderInUnit','supervisorId','status','ugtStart','ugtLevel','notes','catalogId','isTrainer','isCertifier','email','phone','initials'];
  var PERSON_SELF_FIELDS = ['email','phone','initials'];

  ops.savePerson = function (a, me) {
    assertWritable(me);
    var p = a.person || {};
    var existing = p.id ? byId('people', p.id) : null;
    var allowed;
    if (!existing) {
      if (!isAdmin(me) && !(isSup(me) && setting('supCanAdd', 'Y') === 'Y')) err('FORBIDDEN', 'Only an admin can add people.');
      allowed = isAdmin(me) ? PERSON_ADMIN_FIELDS : PERSON_SUP_FIELDS.filter(function (k) { return k !== 'isCertifier' && k !== 'isTrainer'; }).concat(['username','last','first','mi','initials']);
    } else if (isAdmin(me)) allowed = PERSON_ADMIN_FIELDS;
    else if (canManage(me, existing)) allowed = PERSON_SUP_FIELDS.filter(function (k) { return k !== 'isCertifier' && k !== 'isTrainer'; }); // trainers and certifiers are designated by an admin
    else if (existing.id === me.id) allowed = PERSON_SELF_FIELDS;
    else err('FORBIDDEN', 'You cannot edit this person.');
    if (existing && existing.locked === 'Y' && !isAdmin(me) && !canManage(me, existing)) err('LOCKED', 'This record is locked.');
    var row = existing ? JSON.parse(JSON.stringify(existing)) : {
      id: S.newId(), username: '', rank: '', last: '', first: '', mi: '', initials: '', catalogId: '', skill: '3', dutyTitle: '', orgUnit: '', position: '', billet: '', dutyStatus: '', orderInUnit: '0', supervisorId: '', status: 'Active', role: 'member', isTrainer: '', isCertifier: '', ugtStart: '', ugtLevel: '', email: '', phone: '', notes: '', locked: '', lockedBy: '', lockedAt: '', pinHash: '', pinSalt: '', pinSet: '', sigFile: '', archived: '', createdAt: S.now()
    };
    allowed.forEach(function (k) {
      if (!(k in p)) return;
      var v = p[k];
      if (k === 'isTrainer' || k === 'isCertifier' || k === 'archived') v = yn(v);
      else if (k === 'initials') v = initials(v);
      else if (k === 'username') v = normUser(v);
      else if (k === 'role') { v = ROLES[v] ? v : 'member'; }
      else if (k === 'ugtStart') { v = str(v, 10); if (!isDate(v)) err('INVALID', 'Bad date.'); }
      else if (k === 'supervisorId') { v = safeId(v); if (v && !byId('people', v)) v = ''; }
      else if (k === 'orgUnit') { v = safeId(v); if (v && !byId('org', v)) v = ''; }
      else if (k === 'catalogId') v = safeId(v);
      else if (k === 'skill' || k === 'ugtLevel') v = /^[0-9]?$/.test(str(v, 1)) ? str(v, 1) : '';
      else if (k === 'position') v = posCode(v);
      else if (k === 'dutyStatus') v = dutyStatus(v);
      else v = str(v, k === 'notes' ? 4000 : 120);
      row[k] = v;
    });
    if (!row.last || !row.first) err('INVALID', 'First and last name are required.');
    if (!row.username) row.username = normUser(row.last + row.first.charAt(0));
    // unique username
    var all = rows('people');
    for (var i = 0; i < all.length; i++) if (all[i].id !== row.id && all[i].username === row.username) {
      if (existing) err('INVALID', 'Username "' + row.username + '" is already used.');
      row.username = row.username + (all.length + 1);
    }
    if (!row.initials) row.initials = initials(row.first.charAt(0) + (row.mi || '') + row.last.charAt(0));
    if (row.supervisorId === row.id) row.supervisorId = '';
    // prevent removing the last admin
    if (existing && existing.role === 'admin' && (row.role !== 'admin' || row.archived === 'Y')) {
      var admins = all.filter(function (x) { return x.role === 'admin' && x.archived !== 'Y' && x.id !== row.id; });
      if (!admins.length) err('INVALID', 'You cannot remove the last admin.');
    }
    if (!existing && p.pin) validatePin(p.pin);
    beginWrite();
    if (!existing && p.pin) { row.pinSalt = S.newId(); row.pinHash = hashPin(p.pin, row.pinSalt); row.pinSet = 'Y'; row.pinTemp = 'Y'; }
    if (existing && ['role','supervisorId','archived','isTrainer','isCertifier'].some(function (k) { return existing[k] !== row[k]; })) markAcl();
    put('people', row);
    audit(me, existing ? 'person.update' : 'person.add', row.id, fullName(row));
    return result({ id: row.id });
  };

  ops.setPin = function (a, me, token) {
    var p = byId('people', a.personId);
    if (!p) err('NOTFOUND', 'Person not found.');
    if (p.id === me.id) {
      if (p.pinSet === 'Y' && hashPin(str(a.oldPin), p.pinSalt) !== p.pinHash) err('INVALID', 'Current PIN is not correct.');
    } else if (!isAdmin(me)) err('FORBIDDEN', 'Only an admin can reset another person\'s PIN.');
    validatePin(a.pin);

  /* ---------- org ---------- */
  ops.saveOrg = function (a, me) {

      var row = ex ? JSON.parse(JSON.stringify(ex)) : { id: id, name: 'Unit', type: 'element', parentId: '', order: String(i) };
      if ('name' in u) row.name = str(u.name, 80) || 'Unit';

    });
    rows('org').forEach(function (u) { if (u.parentId && (created[u.parentId] || !byId('org', u.parentId))) { var r = JSON.parse(JSON.stringify(u)); r.parentId = created[u.parentId] || ''; put('org', r); } });
    removeIds.forEach(function (id) {

    });
    // assignments: [{personId, orgUnit, billet, orderInUnit, status}]

      if ('orderInUnit' in sx) row.orderInUnit = String(Number(sx.orderInUnit) || 0);
