  /* ---------- records ---------- */
  function recId(pid, cid, iid) { return pid + '|' + cid + '|' + iid; }
  function blankRec(pid, cid, iid) {
    return { id: recId(pid, cid, iid), personId: pid, catalogId: cid, itemId: iid, start: '', complete: '', traineeInit: '', traineeBy: '', traineeAt: '', trainerInit: '', trainerBy: '', trainerAt: '', certInit: '', certBy: '', certAt: '', formal: '', circled: '', notes: '', locked: '', decert: '', decertNote: '', src: '', updatedAt: '', updatedBy: '' };
  }

  // patches: [{itemId, set:{start,complete,notes,circled,formal}, sign:'trainee'|'trainer'|'cert', unsign:'trainee'|'trainer'|'cert', transcribe:{trainee,trainer,cert}, lock:true|false, decert:{note}, recert:true}]
  ops.patchRecords = function (a, me) {
    assertWritable(me);
    var person = byId('people', a.personId);
    if (!person) err('NOTFOUND', 'Person not found.');
    var cid = safeId(a.catalogId) || person.catalogId;
    if (!cid) err('INVALID', 'No CFETP is assigned to this person.');
    var self = person.id === me.id, mgr = canManage(me, person), admin = isAdmin(me);
    if (!self && !mgr && !((me.isTrainer === 'Y' || me.isCertifier === 'Y') && canSeePerson(me, person))) err('FORBIDDEN', 'You do not have permission to edit this CFETP.');
    if (person.locked === 'Y' && !mgr) err('LOCKED', 'This CFETP is locked by a supervisor.');
    var patches = (a.patches || []).slice(0, 1000);
    if (!patches.length) err('INVALID', 'Nothing to save.');
    var existing = {};
    rows('records').forEach(function (r) { if (r.personId === person.id && r.catalogId === cid) existing[r.itemId] = r; });
    var now = S.now(), today = now.substring(0, 10);
    beginWrite();
    var changed = 0, msgs = [];
    patches.forEach(function (pt) {
      var iid = safeId(pt.itemId);
      if (!iid) return;
      var rec = existing[iid] ? JSON.parse(JSON.stringify(existing[iid])) : blankRec(person.id, cid, iid);
      var before = JSON.stringify(rec);
      // lock / unlock (managers only)
      if ('lock' in pt) {
        if (!mgr) err('FORBIDDEN', 'Only a supervisor or admin can lock items.');
        rec.locked = yn(pt.lock);
      }
      if (rec.locked === 'Y' && !mgr) { msgs.push(iid + ': locked'); return; }
      var onlyCircle = pt.set && Object.keys(pt.set).length === 1 && ('circled' in pt.set) && !pt.sign && !pt.unsign && !pt.transcribe;
      if (rec.locked === 'Y' && mgr && !('lock' in pt) && !pt.decert && !pt.recert && !onlyCircle) { msgs.push(iid + ': locked — unlock it first'); return; }
      if (pt.set && !mgr && !self && rec.trainerInit && rec.trainerBy !== me.id && ['start','complete','notes'].some(function (k) { return (k in pt.set) && str(pt.set[k], MAX_TEXT) !== (rec[k] || ''); })) {
        msgs.push(iid + ': signed off by another trainer — they or a supervisor can change it'); return;
      }
      if (pt.set) {
        for (var k in pt.set) {
          if (RECORD_FIELDS_TEXT.indexOf(k) < 0) continue;
          var v = pt.set[k];
          if (k === 'start' || k === 'complete') { v = str(v, 10); if (!isDate(v)) err('INVALID', 'Dates must be YYYY-MM-DD.'); }
          else if (k === 'circled') v = (v === 'Y' || v === 'N') ? v : '';
          else if (k === 'formal') v = yn(v);
          else v = str(v, MAX_TEXT);
          // field-level permissions
          if (k === 'start' && !(self || mgr || me.isTrainer === 'Y')) err('FORBIDDEN', 'You cannot set the start date.');
          if (k === 'complete' && !(mgr || (!self && (me.isTrainer === 'Y' || me.isCertifier === 'Y')))) err('FORBIDDEN', 'The trainer or certifier enters the completion date.');
          if ((k === 'circled' || k === 'formal') && !mgr) err('FORBIDDEN', 'Only a supervisor can change duty-position (MQT) items or formal-training credit.');
          if (k === 'decertNote' && !mgr) continue;
          rec[k] = v;
        }
      }
      if (pt.sign) {
        var as = pt.sign;
        if (as === 'trainee') {
          if (!self) err('FORBIDDEN', 'Only the trainee can initial the trainee column.');
          rec.traineeInit = me.initials; rec.traineeBy = me.id; rec.traineeAt = now;
        } else if (as === 'trainer') {
          if (self) err('FORBIDDEN', 'You cannot sign as trainer on your own CFETP.');
          if (!(me.isTrainer === 'Y' || mgr)) err('FORBIDDEN', 'You are not designated as a trainer.');
          if (rec.certBy && rec.certBy === me.id && setting('allowTrainerCertify', '') !== 'Y') { msgs.push(iid + ': you certified this task, so a different person must sign as trainer'); return; }
          if (rec.trainerInit && rec.trainerBy !== me.id) { msgs.push(iid + ': already signed by trainer ' + rec.trainerInit + ' — remove that sign-off first'); return; }
          rec.trainerInit = me.initials; rec.trainerBy = me.id; rec.trainerAt = now;
          if (!rec.complete) rec.complete = today;
        } else if (as === 'cert') {
          if (self) err('FORBIDDEN', 'You cannot certify your own tasks.');
          if (me.isCertifier !== 'Y') err('FORBIDDEN', 'You are not designated as a certifier.');
          if (!rec.trainerInit) { msgs.push(iid + ': needs the trainer sign-off before certification'); return; }
          if (rec.certInit && rec.certBy !== me.id) { msgs.push(iid + ': already certified by ' + rec.certInit); return; }
          if (rec.trainerBy && rec.trainerBy === me.id && setting('allowTrainerCertify', '') !== 'Y') { if (patches.length === 1) err('FORBIDDEN', 'Third-party certification: the certifier cannot be the trainer for this task.'); msgs.push(iid + ': you trained this task, so a different certifier must certify it'); return; }
          rec.certInit = me.initials; rec.certBy = me.id; rec.certAt = now;
          if (!rec.complete) rec.complete = today;
          if (setting('autoLockCertified', 'Y') === 'Y') rec.locked = 'Y';
        }
        rec.src = rec.src === 'binder' ? 'mixed' : (rec.src || 'digital');
      }
      if (pt.unsign) {
        var u = pt.unsign;
        var ownSig = (u === 'trainee' && rec.traineeBy === me.id) || (u === 'trainer' && rec.trainerBy === me.id) || (u === 'cert' && rec.certBy === me.id);
        if (!ownSig && !mgr) err('FORBIDDEN', 'Only the signer or a supervisor can remove a sign-off.');
        if (u === 'trainee') { rec.traineeInit = ''; rec.traineeBy = ''; rec.traineeAt = ''; }
        if (u === 'trainer') { rec.trainerInit = ''; rec.trainerBy = ''; rec.trainerAt = ''; if (!rec.certInit && rec.formal !== 'Y') rec.complete = ''; }
        if (u === 'cert') { rec.certInit = ''; rec.certBy = ''; rec.certAt = ''; }
      }
      if (pt.transcribe) {
        if (!mgr) err('FORBIDDEN', 'Only a supervisor or admin can transcribe initials from the paper binder.');
        var tr = pt.transcribe;
        // unchanged initials keep their original signer (a real digital signature is not turned into a binder entry)
        if ('trainee' in tr && initials(tr.trainee) !== (rec.traineeInit || '')) { rec.traineeInit = initials(tr.trainee); rec.traineeBy = rec.traineeInit ? 'binder:' + me.id : ''; rec.traineeAt = rec.traineeInit ? now : ''; }
        if ('trainer' in tr && initials(tr.trainer) !== (rec.trainerInit || '')) { rec.trainerInit = initials(tr.trainer); rec.trainerBy = rec.trainerInit ? 'binder:' + me.id : ''; rec.trainerAt = rec.trainerInit ? now : ''; }
        if ('cert' in tr && initials(tr.cert) !== (rec.certInit || '')) { rec.certInit = initials(tr.cert); rec.certBy = rec.certInit ? 'binder:' + me.id : ''; rec.certAt = rec.certInit ? now : ''; }
        rec.src = rec.src === 'digital' ? 'mixed' : 'binder';
      }
      if (pt.decert) {
        if (!mgr) err('FORBIDDEN', 'Only a supervisor or admin can decertify.');
        rec.decert = 'Y'; rec.decertNote = str(pt.decert.note, 2000);
        rec.complete = ''; rec.trainerInit = ''; rec.trainerBy = ''; rec.trainerAt = ''; rec.certInit = ''; rec.certBy = ''; rec.certAt = ''; rec.traineeInit = ''; rec.traineeBy = ''; rec.traineeAt = ''; rec.locked = '';
        rec.start = str(pt.decert.newStart || '', 10);
        if (!isDate(rec.start)) rec.start = '';
      }
      if (pt.recert) { if (!mgr) err('FORBIDDEN', 'Only a supervisor or admin can clear decertification.'); rec.decert = ''; }
      if (JSON.stringify(rec) === before) return;
      var was = existing[iid] || {};
      if (rec.start && rec.complete && rec.start > rec.complete && (rec.start !== (was.start || '') || rec.complete !== (was.complete || ''))) { msgs.push(iid + ': start date ' + rec.start + ' would be after the completion date ' + rec.complete); return; }
      rec.updatedBy = me.id;
      existing[iid] = put('records', rec);
      changed++;
    });
    if (changed) audit(me, 'records.patch', person.id, changed + ' item(s) on ' + cid + (patches.length === 1 ? ' [' + patches[0].itemId + ']' : ''));
    return result({ changed: changed, skipped: msgs });
  };

  // Bulk import of record rows (copy forward, new CFETP version, import from personal tracker / transfer package)
  ops.importRecords = function (a, me) {
    assertWritable(me);
    var person = byId('people', a.personId);
    if (!person) err('NOTFOUND', 'Person not found.');
    if (!canManage(me, person) && !isAdmin(me)) err('FORBIDDEN', 'Only a supervisor or admin can import records.');
    var cid = safeId(a.catalogId);
    if (!cid) err('INVALID', 'Catalog required.');
    var existing = {}, knownSigners = {};
    rows('records').forEach(function (r) {
      if (r.personId !== person.id) return;
      if (r.catalogId === cid) existing[r.itemId] = r;
      ['traineeBy','trainerBy','certBy'].forEach(function (k) { if (r[k]) knownSigners[k + '=' + r[k]] = true; }); // copy-forward keeps real signers
    });
    var overwrite = !!a.overwrite, n = 0;
    beginWrite();
    (a.rows || []).slice(0, 3000).forEach(function (src) {
      var iid = safeId(src.itemId); if (!iid) return;
      if (existing[iid] && !overwrite) return;
      var rec = existing[iid] ? JSON.parse(JSON.stringify(existing[iid])) : blankRec(person.id, cid, iid);
      ['start','complete'].forEach(function (k) { if (k in src) { var v = str(src[k], 10); if (isDate(v)) rec[k] = v; } });
      ['traineeInit','trainerInit','certInit'].forEach(function (k) { if (k in src) rec[k] = initials(src[k]); });
      ['traineeBy','trainerBy','certBy'].forEach(function (k) {
        var ini = rec[k.replace('By', 'Init')];
        if (!ini) { rec[k] = ''; return; }
        var v = str(src[k], 80);
        rec[k] = (v && (knownSigners[k + '=' + v] || /^(binder|import):/.test(v))) ? v : 'import:' + me.id;
      });
      ['traineeAt','trainerAt','certAt'].forEach(function (k) { if (k in src) rec[k] = str(src[k], 40); });
      if ('notes' in src) rec.notes = str(src.notes, MAX_TEXT);
      if ((('circled' in src) || ('formal' in src) || ('locked' in src)) && !canManage(me, person)) err('FORBIDDEN', 'Only a supervisor can import MQT, formal-training or lock status.');
      if ('circled' in src) rec.circled = (src.circled === 'Y' || src.circled === 'N') ? src.circled : '';
      if ('formal' in src) rec.formal = yn(src.formal);
      if ('locked' in src) rec.locked = yn(src.locked);
      rec.src = str(a.src || src.src || 'import', 20);
      rec.updatedBy = me.id;
      put('records', rec); n++;
    });
    audit(me, 'records.import', person.id, n + ' rows into ' + cid + ' (' + str(a.src, 20) + ')');
    return result({ imported: n });
  };

  ops.assignCatalog = function (a, me) {

  /* ---------- generic personal tables ---------- */
  function savePersonal(table, fields, a, me, opts) {
    assertWritable(me);
    var r = a.row || {};
    var existing = r.id ? byId(table, r.id) : null;
    var pid = existing ? existing.personId : str(r.personId, 40);
    var person = byId('people', pid);
    if (!person) err('NOTFOUND', 'Person not found.');
    var self = person.id === me.id, mgr = canManage(me, person);
    var trainerOk = opts.allowTrainer && !self && (me.isTrainer === 'Y' || me.isCertifier === 'Y') && (!existing || existing.createdBy === me.id);
    if (!(self || mgr || trainerOk)) err('FORBIDDEN', 'You cannot edit this person\'s ' + (opts.label || 'items') + '.');
    if (person.locked === 'Y' && !mgr && opts.respectLock) err('LOCKED', 'This record is locked by a supervisor.');
    if (opts.check) opts.check(existing, r, self, mgr);
    var row = existing ? JSON.parse(JSON.stringify(existing)) : { id: S.newId(), personId: pid };
    fields.forEach(function (k) {
      if (!(k in r)) return;
      var v = r[k];
      if (opts.dates && opts.dates.indexOf(k) >= 0) { v = str(v, 10); if (!isDate(v)) err('INVALID', 'Dates must be YYYY-MM-DD.'); }
      else if (opts.flags && opts.flags.indexOf(k) >= 0) v = yn(v);
      else v = str(v, k === 'text' || k === 'notes' ? MAX_TEXT : 300);
      row[k] = v;
    });
    if (opts.finalize) opts.finalize(row, existing, self, mgr);
    beginWrite(); put(table, row);
    audit(me, table + (existing ? '.update' : '.add'), pid, table === 'epb' ? (row.mpa || 'note') : (row.title || row.text || row.kind || '').toString().substring(0, 80));
    return result({ id: row.id });
  }
  function deletePersonal(table, a, me, opts) {

    var person = byId('people', ex.personId);
    var self = person && person.id === me.id, mgr = canManage(me, person);
    if (!(self || mgr)) err('FORBIDDEN', 'You cannot delete this.');
    if (opts && opts.respectLock && person && person.locked === 'Y' && !mgr) err('LOCKED', 'This record is locked by a supervisor.');
    if (opts && opts.check) opts.check(ex, self, mgr);
    beginWrite();
    if (table === 'certs' && ex.files) ex.files.split(',').filter(Boolean).forEach(function (fid) { var f = byId('files', fid); if (f && f.personId === ex.personId && (f.kind === 'cert' || f.kind === 'doc')) { try { S.fileDelete(f); } catch (e) {} del('files', fid); } });
    del(table, ex.id);
    audit(me, table + '.delete', ex.personId, table === 'epb' ? (ex.mpa || 'note') : (ex.title || ex.text || '').toString().substring(0, 80));
    return result();
  }

  ops.saveCert = function (a, me) { return savePersonal('certs', ['title','category','issuer','number','issued','expires','files','items','notes'], a, me, { label: 'certifications', respectLock: true, dates: ['issued','expires'], finalize: function (row, ex) {

  ops.save623 = function (a, me) {

  ops.delete623 = function (a, me) { return deletePersonal('e623', a, me, { check: function (ex, self, mgr) { if ((ex.supInit || ex.traineeInit) && !isAdmin(me)) err('LOCKED', 'Signed entries can only be deleted by an admin.'); if (!mgr && !isAdmin(me)) err('FORBIDDEN', 'Only a supervisor can delete entries.'); } }); };
  ops.sign623 = function (a, me) {
    assertWritable(me);
    var ex = byId('e623', a.id);
    if (!ex) err('NOTFOUND', 'Entry not found.');
    var person = byId('people', ex.personId);
    if (!person) err('NOTFOUND', 'Person not found.');

    var row = JSON.parse(JSON.stringify(ex)), now = S.now();
    if (a.as === 'trainee') {

function calendarItems(from, to, opts) {
  opts = opts || {};

    out.push({ kind: 'event', cls: ({ School: 'school', Deployment: 'deploy', TDY: 'deploy', Evaluation: 'review', 'Training Event': '' })[e.type] || '', date: e.start, end: end, title: e.title, sub: e.type + (ids.length && e.personIds !== '*' ? ' · ' + eventWho(ids) : ' · Unit'), ref: e });
  });
  App.data.certs.forEach(function (c) {
    if (!c.expires || c.expires < from || c.expires > to || !vis[c.personId]) return;

  });
  App.data.targets.forEach(function (t) {

    out.push({ kind: 'target', cls: 'target', date: t.due, title: t.text.split('\n')[0].substring(0, 80), sub: pName(person(t.personId)) + ' · ' + TARGET_KIND_LABEL[t.kind], ref: t });

/* src/js/21_org.js */
/* =====================================================================
 * Task Org — positions (A01…D5), AGR / DSG / Inbound / Outbound coding,
 * vacant slots, board (interactive) and chart (display / print) views.
 * ===================================================================== */
var BILLETS = ['Team Leader','Team Sergeant','Section Lead','Fire Team Lead','Assistant Team Lead','Team Member','FWTL','JTAC','CRO','STO','Medic','Communications','Weapons','Dive Supervisor','Jumpmaster','Training NCO','Inbound','Outbound','Attached'];
var DUTY_STATUS = [['AGR', 'AGR'], ['DSG', 'DSG (drill status)'], ['AD', 'Active duty'], ['TR', 'Traditional reservist'], ['CIV', 'Civilian']];
function dutyLabel(v) { var d = DUTY_STATUS.filter(function (x) { return x[0] === v; })[0]; return d ? d[0] : ''; }
function orgTone(p) {
  if (!p) return 'vac';
  if (p.status === 'Inbound') return 'in';
  if (p.status === 'Outbound') return 'out';
  return { AGR: 'agr', DSG: 'dsg' }[p.dutyStatus] || 'oth';
}
function unitSlots(u) { return (u && u.slots ? u.slots.split(',') : []).filter(Boolean); }
function orgUnitsSorted(parentId) { return sortBy(App.data.org.filter(function (u) { return (u.parentId || '') === (parentId || ''); }), function (u) { return pad3(u.order); }); }
function orgTitle() { return setting('orgTitle', '') || setting('unitShort', '123 STS'); }
function canEditOrg() { return !Perm.readOnly() && (Perm.admin() || (Perm.sup() && setting('supCanEditOrg', 'Y') === 'Y')); }
function orgPeople() { return visiblePeople().filter(function (p) { return p.archived !== 'Y' && p.status !== 'Separated'; }); }
// Line 2 of a position box: "PJ / 7 LVL FWTL", "CCT / 5 LVL JTAC", or the billet for officers ("CRO", "STO").
function orgLine(p) {
  var cat = catOf(p), parts = [];
  if (cat) parts.push(cat.short + (p.skill ? ' / ' + p.skill + ' LVL' : ''));
  if (p.billet && !/^(team member|inbound|outbound|attached)$/i.test(p.billet)) parts.push(p.billet);
  else if (!cat && p.dutyTitle) parts.push(p.dutyTitle);
  return parts.join(' ');
}
// Members of a unit laid out by position: [{slot, p}] for each slot (p null = vacant), then members without a slot.
function unitLayout(u, people) {
  var mem = people.filter(function (p) { return p.orgUnit === u.id; });
  var used = {}, out = [];
  unitSlots(u).forEach(function (code) {
    var hit = mem.filter(function (p) { return p.position === code && !used[p.id]; });
    if (hit.length) hit.forEach(function (p) { used[p.id] = 1; out.push({ slot: code, p: p }); });
    else out.push({ slot: code, p: null });
  });
  sortBy(mem.filter(function (p) { return !used[p.id]; }), function (p) { return pad3(p.orderInUnit) + p.last; }).forEach(function (p) { out.push({ slot: p.position || '', p: p, extra: true }); });
  return out;
}
function orgTotals(people) {
  var t = { total: 0, AGR: 0, DSG: 0, other: 0, inbound: 0, outbound: 0, vacant: 0 };
  people.forEach(function (p) {
    var u = App.idx.org[p.orgUnit];
    if (p.status === 'Inbound') { t.inbound++; return; }
    if (p.status === 'Outbound') { t.outbound++; return; }
    if (!u || u.type === 'special') return;
    t.total++;
    if (p.dutyStatus === 'AGR') t.AGR++; else if (p.dutyStatus === 'DSG') t.DSG++; else t.other++;
  });
  App.data.org.forEach(function (u) { if (u.type !== 'special') unitLayout(u, people).forEach(function (x) { if (!x.p) t.vacant++; }); });
  return t;
}
function orgAsOf() {
  var d = '';
  App.data.org.forEach(function (u) { if (u.updatedAt > d) d = u.updatedAt; });
  App.data.people.forEach(function (p) { if (p.orgUnit && p.updatedAt > d) d = p.updatedAt; });
  return d ? d.substring(0, 10) : today();
}

/* ---------------- board (interactive) ---------------- */
function orgBoard(people, edit) {

function orgChartSheet(people) {

/* ---------------- editing ---------------- */
// Only the changed units / removals / assignments are sent, so two editors never overwrite each other's work.
function saveOrg(units, assign, remove) {
  return API.call('saveOrg', { units: units || [], assign: assign || [], remove: remove || [] }).then(function () { rerender(true); }).catch(function () {});
}
function statusForUnit(unit, p) {
  if (unit && unit.type === 'special' && /inbound/i.test(unit.name)) return 'Inbound';
  if (unit && unit.type === 'special' && /outbound/i.test(unit.name)) return 'Outbound';
  if (p && (p.status === 'Inbound' || p.status === 'Outbound')) return 'Active';
  return p ? p.status : 'Active';
}
// Move person p into unit uid at position slot; whoever held that slot takes p's old position (swap).
function placePerson(p, uid, slot) {
  var unit = App.idx.org[uid] || null;
  var a = [{ personId: p.id, orgUnit: uid, position: slot || '', status: statusForUnit(unit, p), orderInUnit: String(App.data.people.filter(function (x) { return x.orgUnit === uid; }).length) }];
  if (slot) {
    var holder = App.data.people.filter(function (x) { return x.id !== p.id && x.orgUnit === uid && x.position === slot && x.archived !== 'Y'; })[0];
    if (holder) a.push({ personId: holder.id, orgUnit: p.orgUnit || '', position: p.position || '', status: statusForUnit(App.idx.org[p.orgUnit], holder) });
  }
  return saveOrg(null, a);
}
function bindOrgDrag() {
  $$('.pcard[draggable=true]').forEach(function (c) {
    c.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', c.getAttribute('data-pid')); e.dataTransfer.effectAllowed = 'move'; });
  });
  var clear = function () { $$('.drop').forEach(function (x) { x.classList.remove('drop'); }); };
  $$('.org .pcard[data-slot], .org [data-unit]').forEach(function (t) {
    t.addEventListener('dragover', function (e) { e.preventDefault(); e.stopPropagation(); clear(); t.classList.add('drop'); });
    t.addEventListener('dragleave', function () { t.classList.remove('drop'); });

      e.preventDefault(); e.stopPropagation(); clear();
      var p = person(e.dataTransfer.getData('text/plain')); if (!p) return;
      var isCard = t.classList.contains('pcard'), uid = isCard ? t.getAttribute('data-unit-id') : t.getAttribute('data-unit'), slot = isCard ? t.getAttribute('data-slot') : '';
      if (p.orgUnit === uid && (p.position || '') === (slot || '') ) return;
      placePerson(p, uid || '', slot);

  });
}
function unitOptions(sel) {

/* ---------------- code decoding ---------------- */
var STD_CODES = {
  '1': 'Can do simple parts of the task. Needs to be told or shown how to do most of the task. (Extremely Limited)',
  '2': 'Can do most parts of the task. Needs help only on hardest parts. (Partially Proficient)',
  '3': 'Can do all parts of the task. Needs only a spot check of completed work. (Competent)',
  '4': 'Can do the complete task quickly and accurately. Can tell or show others how to do the task. (Highly Proficient)',
  'a': 'Can name parts, tools, and simple facts about the task. (Nomenclature)',
  'b': 'Can determine step by step procedures for doing the task. (Procedures)',
  'c': 'Can identify why and when the task must be done and why each step is needed. (Operating Principles)',
  'd': 'Can predict, isolate, and resolve problems about the task. (Advanced Theory)',
  'A': 'Can identify basic facts and terms about the subject. (Facts)',
  'B': 'Can identify relationship of basic facts and state general principles about the subject. (Principles)',
  'C': 'Can analyze facts and principles and draw conclusions about the subject. (Analysis)',
  'D': 'Can evaluate conditions and make proper decisions about the subject. (Evaluation)',
  '-': 'No proficiency training provided in the course or CDC.',
  'X': 'Training is required but not given due to limitations in resources.'
};
function decodeCode(cat, code) {
  code = String(code || '').trim();
  if (!code) return [];
  var leg = {};
  ((cat && cat.legend && cat.legend.codes) || []).forEach(function (c) { leg[c.code] = c.def; });
  if (leg[code]) return [{ code: code, text: leg[code] }];
  var out = [];
  code.split('/').forEach(function (part) {
    part = part.trim(); if (!part) return;
    if (leg[part]) { out.push({ code: part, text: leg[part] }); return; }
    if (part.toLowerCase() === 'x') { out.push({ code: 'X', text: leg.X || STD_CODES.X }); return; }
    if (part === '-') { out.push({ code: '-', text: leg['-'] || STD_CODES['-'] }); return; }
    var m = part.match(/^([1-4])?([a-dA-D])?$/);
    if (m) { if (m[1]) out.push({ code: m[1], text: leg[m[1]] || STD_CODES[m[1]] }); if (m[2]) out.push({ code: m[2], text: leg[m[2]] || STD_CODES[m[2]] }); return; }
    out.push({ code: part, text: 'See the CFETP proficiency code key.' });
  });
  return out;
}

}
function thumbImg(fid) { return logoImg(fid, ic('image')); }
act('viewFile', function (el) {
  var id = el.getAttribute('data-id'), f = App.idx.files[id];
  Modal.open({ title: f ? f.name : 'Document', size: 'xwide', body: '<div id="fv" class="center muted">Loading…</div>', footer: '<button class="btn" data-mact="dl">' + ic('download', 'sm') + ' Download</button><button class="btn" data-modal-close>Close</button>',
    onOpen: function (m) {

        else if (o.mime === 'application/pdf') box.innerHTML = '<iframe src="' + o.url + '" style="width:100%;height:72vh;border:0;border-radius:8px;background:#fff" title="PDF"></iframe><div class="xs muted mt8">If the PDF does not display, use Download.</div>';
        else if (o.mime === 'text/plain' || o.mime === 'application/json') { box.innerHTML = '<pre class="small" style="text-align:left;white-space:pre-wrap;max-height:72vh;overflow:auto"></pre>'; o.blob.text().then(function (t) { box.firstChild.textContent = t; }); }
        else box.innerHTML = '<p>Preview not available. Use Download.</p>';
      }).catch(function () { $('#fv', m.el).textContent = 'Could not load this file.'; });
    },
    actions: { dl: function (m) { if (m.file) downloadBlob(m.file.name, m.file.blob); } } });
});
act('certScan', function (el) {
  var pid = el.getAttribute('data-pid');
  pickFile('image/*', true, true).then(function (files) { if (files.length) certEditor(person(pid), null, null, files); });
});
act('certEdit', function (el) {
  var id = el.getAttribute('data-id');
  if (id) { var c = App.data.certs.filter(function (x) { return x.id === id; })[0]; certEditor(person(c.personId), c); }
  else certEditor(person(el.getAttribute('data-pid')), null, el.getAttribute('data-cat'));
});
function certEditor(p, c, presetCat, presetFiles) {
  var isNew = !c; c = c || { category: presetCat || '', files: '', items: '' };
  var cat = catOf(p), cats = certCategories(cat);
  var pending = (presetFiles || []).slice(), files = (c.files || '').split(',').filter(Boolean);
  var body = '<form class="col" autocomplete="off"><div class="fgrid">' +
    '<label class="f span2">Title<input class="input" name="title" list="cert-sugg" value="' + attr(c.title) + '" required placeholder="e.g. NREMT-Paramedic"><datalist id="cert-sugg">' + CERT_SUGGEST.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('') + '</datalist></label>' +
    '<label class="f">Binder tab / category<select class="select" name="category">' + cats.map(function (k) { return '<option' + (k === c.category ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('') + (c.category && cats.indexOf(c.category) < 0 ? '<option selected>' + esc(c.category) + '</option>' : '') + '</select></label>' +
    '<label class="f">Issuing organization<input class="input" name="issuer" value="' + attr(c.issuer) + '"></label>' +
    '<label class="f">Certificate / order number<input class="input" name="number" value="' + attr(c.number) + '"><span class="hint">Never an SSN or DoD ID</span></label>' +
    '<label class="f">Issued<input class="input" type="date" name="issued" value="' + attr(c.issued) + '"></label>' +
    '<label class="f">Expires<input class="input" type="date" name="expires" value="' + attr(c.expires) + '"></label>' +
    '<label class="f span2">Linked STS items<input class="input mono" name="items" value="' + attr(c.items) + '" placeholder="e.g. 4.1.2, 7.11.3"><span class="hint">Comma-separated item numbers this document supports</span></label>' +
    '<label class="f full">Notes<textarea class="input" name="notes" rows="2">' + esc(c.notes) + '</textarea></label></div>' +
    '<div class="sec-t">Scanned files</div><div id="ce-files" class="thumbs"></div>' +
    '<div class="dropzone mt8" id="ce-drop">' + ic('upload') + '<div>Drop PDFs or images here, or <b>click to choose</b>. On a phone you can take a photo.</div><div class="xs">Photos are compressed automatically. Max 12 MB per file.</div></div></form>';
  Modal.open({
    title: isNew ? 'Add certification / document — ' + pName(p, 'last') : 'Edit ' + c.title, size: 'wide', body: body,
    footer: (isNew ? '' : '<button class="btn danger" data-mact="del">' + ic('trash', 'sm') + ' Delete</button>') + '<span class="spacer"></span><button class="btn" data-modal-close>Cancel</button><button class="btn primary" data-mact="save">Save</button>',
    onOpen: function (m) {
      var drawFiles = function () {
        $('#ce-files', m.el).innerHTML = files.map(function (fid) { var f = App.idx.files[fid]; return '<div class="thumb" title="' + attr(f ? f.name : '') + '" style="position:relative">' + (f && /^image/.test(f.mime) ? thumbImg(fid) : ic('file')) + '<button type="button" class="btn xs" style="position:absolute;top:2px;right:2px;padding:0 4px" data-mact="rmfile" data-id="' + attr(fid) + '">×</button></div>'; }).join('') +
          pending.map(function (f, i) { return '<div class="thumb" title="' + attr(f.name) + '" style="position:relative;border-style:dashed">' + ic(/^image/.test(f.type) ? 'image' : 'file') + '<span class="xs" style="position:absolute;bottom:2px">new</span><button type="button" class="btn xs" style="position:absolute;top:2px;right:2px;padding:0 4px" data-mact="rmpend" data-i="' + i + '">×</button></div>'; }).join('');
      };
      m.draw = drawFiles; drawFiles();
      var dz = $('#ce-drop', m.el);
      dz.addEventListener('click', function () { pickFile('application/pdf,image/*', true).then(function (fs) { pending = pending.concat(fs); drawFiles(); }); });
      dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', function () { dz.classList.remove('over'); });
      dz.addEventListener('drop', function (e) { e.preventDefault(); dz.classList.remove('over'); pending = pending.concat(Array.prototype.slice.call(e.dataTransfer.files || [])); drawFiles(); });
    },
    actions: {
      rmfile: function (m, b) { var id = b.getAttribute('data-id'); files = files.filter(function (x) { return x !== id; }); m.removed = (m.removed || []).concat([id]); m.draw(); },
      rmpend: function (m, b) { pending.splice(Number(b.getAttribute('data-i')), 1); m.draw(); },
      save: function (m, btn) {
        var f = $('form', m.el);
        if (!f.title.value.trim()) { toast('Title is required.', 'warn'); return; }
        if (/\b\d{3}-?\d{2}-?\d{4}\b/.test(f.number.value + ' ' + f.notes.value)) { toast('That looks like an SSN. Remove it before saving.', 'bad'); return; }
        btn.disabled = true; btn.textContent = pending.length ? 'Uploading…' : 'Saving…';
        var ups = pending.reduce(function (pr, file) { return pr.then(function (acc) { return uploadFile(file, 'cert', p.id).then(function (meta) { acc.push(meta.id); return acc; }); }); }, Promise.resolve([]));
        ups.then(function (newIds) {
          var items = f.items.value.split(/[,\s]+/).map(function (x) { return x.trim().replace(/\.$/, ''); }).filter(Boolean);
          var unknown = cat ? items.filter(function (i) { return !cat.byId[i]; }) : [];
          if (unknown.length) toast('Not in this CFETP: ' + unknown.join(', '), 'warn');
          var row = { id: c.id, personId: p.id, title: f.title.value.trim(), category: f.category.value, issuer: f.issuer.value, number: f.number.value, issued: f.issued.value, expires: f.expires.value, items: items.join(','), notes: f.notes.value, files: files.concat(newIds).join(',') };
          return API.call('saveCert', { row: row }).then(function () {
            (m.removed || []).forEach(function (fid) { API.call('deleteFile', { id: fid }, { silent: true, quiet: true }).catch(function () {}); });
            Modal.close(m); toast('Saved.', 'ok'); rerender(true);
          });
        }).catch(function () { btn.disabled = false; btn.textContent = 'Save'; });
      },
      del: function (m) { confirmBox('Delete "' + c.title + '" and its scanned files?', { danger: true, ok: 'Delete' }).then(function (ok) { if (ok) API.call('deleteCert', { id: c.id }).then(function () { Modal.close(m); rerender(true); }).catch(function () {}); }); }
    }
  });
  if (presetFiles && presetFiles.length) setTimeout(function () { toast(presetFiles.length + ' photo(s) ready — fill in the details and Save.', '', 2500); }, 50);
}

function certMatrix() {

  var cols = Object.keys(titles).sort(function (a, b) { return titles[b] - titles[a] || (a < b ? -1 : 1); }).slice(0, 18);
  if (!cols.length) return emptyState('award', 'No certifications recorded yet. Add them from each member\'s Certifications tab.');
  var by = {};
  App.data.certs.forEach(function (c) { var k = c.personId + '|' + c.title; if (!by[k] || (c.expires || '9999') > (by[k].expires || '9999')) by[k] = c; });
  return '<div class="card"><div class="bd tight scrollx"><table class="tbl matrix"><thead><tr><th>Member</th>' + cols.map(function (c) { return '<th style="min-width:92px;white-space:normal">' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +

        var c = by[p.id + '|' + t]; if (!c) return '<td class="cell muted">—</td>';
        var s = certStatus(c);
        return '<td class="cell ' + (s.cls || 'ok') + '" title="' + attr(s.label) + '">' + (c.expires ? esc(fmtDate(c.expires, 'short')) : '✓') + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div></div><div class="row wrap mt8 small muted"><span class="pill ok">current</span><span class="pill warn">expires within ' + esc(setting('dueSoonDays', '60')) + ' days</span><span class="pill bad">expired</span><span>Most common ' + cols.length + ' certifications shown.</span></div>';
}
function allDocs() {
  var vis = byKey(visiblePeople().filter(function (p) { return Perm.seePrivate(p); }), 'id');
  var list = sortBy(App.data.certs.filter(function (c) { return vis[c.personId]; }), function (c) { var s = certStatus(c); return (s.d === null ? 99999 : s.d); });

  }).join('') + '</tbody></table></div></div>';

function binderIndex() {

      tabs.map(function (t) { return '<details class="acc"><summary><span class="tag">Tab ' + esc(t.tab) + '</span> ' + esc(t.title) + '</summary><div class="ad">' + esc(t.desc) + '</div></details>'; }).join('') +
      (cat.recordTabs && cat.recordTabs.length && !/^\d/.test(String(cat.recordTabs[0].tab)) ? '<div class="sec-t">Record requirements in this CFETP</div>' + cat.recordTabs.map(function (t) { return '<details class="acc"><summary>' + esc(t.title || t.tab) + '</summary><div class="ad">' + esc(t.desc) + '</div></details>'; }).join('') : '') + '</div></div>';
  }).join('') + '</div>';
}

/* =====================================================================
 * DAF Form 623A — OJT Record Continuation Sheet: entries, drafts, print
 * ===================================================================== */
var E623_TYPES = ['Initial Evaluation', 'Upgrade Training Start', 'Progress Review', 'Task Training', 'Task Certification Summary', 'Decertification', 'Restriction / Waiver', 'Course Completion', 'CFETP Transcription', 'Pre-Deployment UGT Status', 'Upgrade Recommendation', 'Other'];

function e623Tab(p) {
  var list = sortBy(App.data.e623.filter(function (e) { return e.personId === p.id; }), function (e) { return e.date + e.updatedAt; }).reverse();
  var canWrite = (Perm.manage(p) || ((Perm.trainer() || Perm.certifier()) && !Perm.self(p)) || (Perm.self(p) && setting('membersWrite623') === 'Y')) && !Perm.readOnly();
  var html = '<div class="row wrap mb12"><span class="small muted grow">Each entry needs the date, comments, and the initials of the trainee and the trainer/supervisor (CFETP Part II). Record strengths, weaknesses and recommended actions.</span>' +
    '<button class="btn" data-act="print623" data-id="' + p.id + '"' + (list.length ? '' : ' disabled') + '>' + ic('print') + ' Print DAF Form 623A</button>' +
    (canWrite ? '<button class="btn" data-act="draft623" data-id="' + p.id + '">' + ic('pen') + ' Generate draft</button><button class="btn primary" data-act="new623" data-id="' + p.id + '">' + ic('plus') + ' New entry</button>' : '') + '</div>';
  if (!list.length) return html + emptyState('form', 'No 623A entries yet.' + (canWrite ? ' Generate a draft from this member\'s record or write one.' : ''));
  return html + '<div class="col">' + list.map(function (e) { return entryCard(p, e); }).join('') + '</div>';
}
function entryCard(p, e) {
  var self = Perm.self(p), mgr = Perm.manage(p), ro = Perm.readOnly() || (p.locked === 'Y' && !mgr);
  var canSup = !self && (mgr || Perm.trainer() || Perm.certifier()) && !ro;
  var signed = e.traineeInit && e.supInit;
  return '<div class="epb-item"><div class="eh"><b>' + esc(fmtDate(e.date)) + '</b><span class="pill">' + esc(e.type || 'Entry') + '</span>' + (signed ? '<span class="pill ok">' + ic('check', 'sm') + ' Signed</span>' : '<span class="pill warn">Awaiting initials</span>') + '<span class="spacer"></span>' +
    ((mgr || (!e.supInit && !e.traineeInit && e.createdBy === App.meId)) && !ro ? '<button class="btn xs ghost" data-act="edit623" data-id="' + e.id + '">' + ic('edit', 'sm') + ' Edit</button>' : '') +
    ((mgr || Perm.admin()) && !ro ? '<button class="btn xs ghost" data-act="del623" data-id="' + e.id + '">' + ic('trash', 'sm') + '</button>' : '') + '</div>' +
    '<div class="et">' + esc(e.text) + '</div>' +
    '<div class="row wrap mt12 gap12 small">' +
    '<span>Trainee: ' + (e.traineeInit ? '<b class="mono">' + esc(e.traineeInit) + '</b> <span class="muted">' + esc(fmtDateTime(e.traineeAt)) + '</span>' + (self && !ro ? ' <a href="#" data-act="sign623" data-id="' + e.id + '" data-as="trainee" data-rm="1">remove</a>' : '') : (self && !ro ? '<button class="btn xs primary" data-act="sign623" data-id="' + e.id + '" data-as="trainee">' + ic('pen', 'sm') + ' Initial as trainee</button>' : '<span class="muted">—</span>')) + '</span>' +
    '<span>Trainer/Supervisor: ' + (e.supInit ? '<b class="mono">' + esc(e.supInit) + '</b> <span class="muted">' + esc(e.supName || '') + ' · ' + esc(fmtDateTime(e.supAt)) + '</span>' + (e.supBy === App.meId && !ro ? ' <a href="#" data-act="sign623" data-id="' + e.id + '" data-as="sup" data-rm="1">remove</a>' : '') : (canSup ? '<button class="btn xs primary" data-act="sign623" data-id="' + e.id + '" data-as="sup">' + ic('pen', 'sm') + ' Initial as trainer/supervisor</button>' : '<span class="muted">—</span>')) + '</span></div></div>';
}
act('new623', function (el) { edit623(person(el.getAttribute('data-id')), null, null); });
act('edit623', function (el) { var e = App.data.e623.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]; edit623(person(e.personId), e); });
act('del623', function (el) { confirmBox('Delete this 623A entry?', { danger: true, ok: 'Delete' }).then(function (ok) { if (ok) API.call('delete623', { id: el.getAttribute('data-id') }).then(function () { rerender(true); }).catch(function () {}); }); });
act('sign623', function (el) {
  var as = el.getAttribute('data-as') === 'trainee' ? 'trainee' : 'supervisor', rm = !!el.getAttribute('data-rm');
  var go2 = function () { API.call('sign623', { id: el.getAttribute('data-id'), as: as, remove: rm }).then(function () { toast(rm ? 'Initials removed.' : 'Initialed.', 'ok'); rerender(true); }).catch(function () {}); };
  if (rm) go2(); else confirmBox('Initial this entry as ' + (as === 'trainee' ? 'the trainee' : 'trainer/supervisor') + ' with "' + me().initials + '"? Editing the text later clears both initials.', { ok: 'Initial' }).then(function (ok) { if (ok) go2(); });
});
function edit623(p, e, preset) {
  var isNew = !e; e = e || Object.assign({ date: today(), type: 'Progress Review', text: '' }, preset || {});
  Modal.open({
    title: (isNew ? 'New 623A entry — ' : 'Edit 623A entry — ') + pName(p, 'last'), size: 'wide',
    body: '<form class="col"><div class="fgrid"><label class="f">Date<input class="input" type="date" name="date" value="' + attr(e.date) + '"></label><label class="f">Entry type<select class="select" name="type">' + E623_TYPES.map(function (t) { return '<option' + (t === e.type ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label></div>' +
      '<label class="f">Comments<span class="hint">Strengths, weaknesses, recommended actions, restrictions. Keep it factual; no medical details.</span><textarea class="input" name="text" rows="12" style="font-family:var(--font)">' + esc(e.text) + '</textarea></label>' +
      '<div class="row wrap"><span class="small muted">Insert:</span><button type="button" class="btn xs" data-mact="ins" data-k="review">Progress summary</button><button type="button" class="btn xs" data-mact="ins" data-k="sw">Strengths / weaknesses / actions</button><button type="button" class="btn xs" data-mact="ins" data-k="remain">Remaining core tasks</button></div>' +
      (!isNew && (e.traineeInit || e.supInit) ? '<div class="pill warn" style="white-space:normal">Changing the date or text clears the existing initials so both parties re-initial.</div>' : '') + '</form>',
    footer: '<button class="btn" data-modal-close>Cancel</button><button class="btn primary" data-mact="save">Save entry</button>',
    actions: {
      ins: function (m, b) {
        var ta = $('textarea', m.el), k = b.getAttribute('data-k'), add = '';
        if (k === 'review') add = draftText(p, 'Progress Review');
        if (k === 'sw') add = 'Strengths: \nWeaknesses / areas to improve: \nRecommended actions: ';
        if (k === 'remain') { var pr = progressFor(p); add = pr && pr.focus ? 'Remaining ' + pr.focus.label + ' items (' + pr.focus.remaining.length + '): ' + pr.focus.remaining.join(', ') : ''; }
        ta.value = (ta.value ? ta.value.replace(/\s+$/, '') + '\n\n' : '') + add; ta.focus();
      },
      save: function (m) {
        var f = $('form', m.el);
        if (!f.text.value.trim()) { toast('Write the entry first.', 'warn'); return; }
        API.call('save623', { row: { id: e.id, personId: p.id, date: f.date.value, type: f.type.value, text: f.text.value.trim() } }).then(function () { Modal.close(m); toast('Entry saved. Both parties initial it to make it valid.', 'ok', 4500); if (App.route.name !== 'person') rerender(true); else go('person', p.id, '623'); }).catch(function () {});
      }
    }
  });
}
act('draft623', function (el) {
  var p = person(el.getAttribute('data-id'));
  Modal.open({ title: 'Generate a 623A draft', body: '<p class="small muted">Builds the entry text from ' + esc(pName(p)) + '\'s live record. You review and edit it before saving; nothing is signed automatically.</p><div class="col mt12">' +
    ['Progress Review', 'Initial Evaluation', 'Upgrade Training Start', 'Task Certification Summary', 'Pre-Deployment UGT Status', 'CFETP Transcription', 'Upgrade Recommendation'].map(function (t) { return '<button class="btn" style="justify-content:flex-start" data-mact="g" data-t="' + t + '">' + ic('pen', 'sm') + ' ' + t + '</button>'; }).join('') + '</div>',
    actions: { g: function (m, b) { var t = b.getAttribute('data-t'); Modal.close(m); edit623(p, null, { type: t, text: draftText(p, t) }); } } });
});
function lastEntryDate(p) { return App.data.e623.filter(function (e) { return e.personId === p.id; }).map(function (e) { return e.date; }).sort().pop() || ''; }
function draftText(p, type) {

        '\nCompleted since ' + fmtDate(since) + ' (' + doneSince.length + '): ' + (doneSince.length ? list(doneSince.map(function (i) { return i.id; }), 25) : 'none') + '.' +
        (f && f.remaining.length ? '\nRemaining (' + f.remaining.length + '): ' + list(f.remaining, 25) + '.' : '') +
        '\nStrengths: \nWeaknesses / areas to improve: \nRecommended actions / next 90 days: ' + (targets.length ? targets.join('; ') : '') + '\nTrainee is ' + (f && f.pct >= 100 ? 'complete on all required items.' : 'progressing [on track / behind] for upgrade.');
    case 'Initial Evaluation':
      return 'Initial evaluation completed. ' + nm + ' (' + (cat ? cat.career + ', AFSC ' + cat.afsc : 'AFSC') + ', ' + (p.skill || '') + '-skill level) was briefed on the upgrade and qualification training program, the CFETP, the trainee\'s and supervisor\'s responsibilities, and the duty-position requirements (circled STS items). Current status: ' + (f ? f.done + '/' + f.req + ' ' + f.label.toLowerCase() + ' items complete' : 'no items documented') + '.\nPrior experience / qualifications: \nTraining plan: \nTrainee and supervisor agree with the training plan.';
    case 'Upgrade Training Start':
      return nm + ' entered upgrade training to the ' + (lvl || '[5/7]') + '-skill level on ' + fmtDate(p.ugtStart || t) + '. Trainee was briefed on the upgrade requirements, core tasks (' + (f ? f.req : '') + ' items), minimum time in training, and the 623A documentation process. Trainer(s): \nCertifier(s): ';
    case 'Task Certification Summary':
      return 'Tasks trained/certified between ' + fmtDate(since) + ' and ' + fmtDate(t) + ' (' + doneSince.length + '):\n' + doneSince.map(function (i) { var r = recs[i.id]; return i.id + ' ' + i.title + ' — ' + (r.certInit ? 'certified (' + r.certInit + ')' : 'trained (' + (r.trainerInit || '') + ')') + (r.complete ? ' ' + fmtDate(r.complete) : ''); }).join('\n') + '\nTrainee met the training standard (go/no-go) on all items listed.';
    case 'Pre-Deployment UGT Status':
      return 'Pre-deployment upgrade training status. ' + nm + ' has ' + (f ? (f.req - f.done) + ' remaining ' + f.label.toLowerCase() + ' items' : 'remaining items as listed') + '. Remaining upgrade training tasks: ' + (f ? list(f.remaining, 40) : '') + '.\nTraining that can be accomplished while deployed: \nRecord copy to accompany member: [Yes/No]';
    case 'CFETP Transcription':
      return 'I certify the information contained in the CFETP dated [old CFETP date] was transcribed to the CFETP dated ' + (cat ? cat.cfetpDateText : '[new CFETP date]') + ' on ' + fmtDate(t) + '. Transcription is an administrative action and not a re-evaluation of training.';
    case 'Upgrade Recommendation':
      return 'I recommend ' + nm + ' for award of the ' + (lvl || '[X]') + '-skill level. All ' + (f ? f.req + ' ' + f.label.toLowerCase() + ' items are ' + (f.pct >= 100 ? 'complete' : 'NOT yet complete (' + f.done + '/' + f.req + ')') : 'required items are complete') + '.' + (months !== null ? ' Time in training: ' + months + ' months.' : '') + ' Mandatory courses/formal training: [list]. Member meets all other award requirements in CFETP Part I.';

function select623(p, m) {

  return sortBy(App.data.e623.filter(function (e) { return e.personId === p.id && e.date >= from && e.date <= to && (uns || (e.traineeInit && e.supInit)); }), function (e) { return e.date + e.updatedAt; });
}
function build623(p, m) {
  var entries = select623(p, m), withSig = $('#p6-sig', m.el).checked;
  var sigIds = {};
  if (withSig) entries.forEach(function (e) { [e.traineeBy, e.supBy].forEach(function (id) { var x = person(id); if (x && x.sigFile) sigIds[x.sigFile] = 1; }); });
  return Promise.all(Object.keys(sigIds).map(function (fid) { return fetchFile(fid).catch(function () { return null; }); })).then(function () {
    var sigCell = function (init, by, at) {
      if (!init) return '<span class="ln">&nbsp;</span>';
      var x = person(by), img = withSig && x && x.sigFile && App.fileUrls[x.sigFile] ? '<img src="' + App.fileUrls[x.sigFile].url + '" alt="">' : '';
      return '<span class="ln">' + img + '<b>' + esc(init) + '</b>' + (at ? ' <span class="ts">' + esc(fmtDate(at.substring(0, 10))) + '</span>' : '') + '</span>';
    };
    // Matches DAF Form 623A (20230331): one bordered box with the title band, an open entry area and the
    // LAST NAME - FIRST NAME - MIDDLE INITIAL block; form number lines below the box. Entries are written into
    // the open area. Pagination measures the real layout: every sheet is one printed page, and an entry too long
    // for one page is split at a word boundary and continued on the next sheet.
    var nm = esc(pName(p, 'formal'));
    var mkB = sensBanner() || (sensHandling() ? sensHandling().toUpperCase() : ''), mkI = sensIndicatorCompact();
    var sheet = function (rows, i, total) {
      return '<div class="sheet f623">' + (mkB ? '<div class="mk mk-t">' + esc(mkB) + '</div><div class="mk mk-b">' + esc(mkB) + '</div>' : '') + '<div class="box"><div class="ttl">ON - THE - JOB TRAINING RECORD<br>CONTINUATION SHEET</div>' +
        '<div class="body"><div class="ents">' + rows + '</div></div>' +
        '<div class="nm"><span class="lbl">LAST NAME - FIRST NAME - MIDDLE INITIAL</span><span class="fv">' + nm + '</span></div></div>' +
        '<div class="foot"><div><b>DAF FORM 623A, 20230331</b><br>Prescribed by: DAFMAN 36-2689<br><span class="pv">PREVIOUS VERSIONS OF THIS FORM MAY BE USED</span></div><div class="pg">' + (i === 0 ? mkI.map(function (x) { return '<div class="di">' + esc(x) + '</div>'; }).join('') : '') + '<div>Page ' + (i + 1) + ' of ' + total + '</div></div></div></div>';
    };
    var row = function (q, text, more) {
      return '<div class="ent">' + (q.cont ? '<div class="eh">' + esc(fmtDate(q.e.date)) + ' (continued)</div>' : '<div class="eh">' + esc(fmtDate(q.e.date)) + (q.e.type ? ' &mdash; ' + esc(q.e.type.toUpperCase()) : '') + '</div>') +
        '<div class="c">' + esc(text) + (more ? '\n<i>(continued on next page)</i>' : '') + '</div>' +
        (more ? '' : '<div class="sg"><span>Trainee initials:</span>' + sigCell(q.e.traineeInit, q.e.traineeBy, q.e.traineeAt) + '<span>Trainer/Supervisor initials:</span>' + sigCell(q.e.supInit, q.e.supBy, q.e.supAt) + '</div>') + '</div>';
    };
    var host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-20000px;top:0;visibility:hidden;pointer-events:none';
    document.body.appendChild(host);
    host.innerHTML = sheet('', 0, 1);
    var sh = host.firstChild, body = sh.querySelector('.body'), tb = sh.querySelector('.ents');
    var fits = function (html) { tb.innerHTML = html; return tb.offsetHeight <= body.clientHeight - 2; };
    var pages = [], cur = [], queue = entries.map(function (e) { return { e: e, text: e.text + (e.supName ? '\n— ' + e.supName : ''), cont: false }; });
    var guard = 0;
    while (queue.length && guard++ < 5000) {
      var q = queue.shift(), r1 = row(q, q.text, false);
      if (fits(cur.concat([r1]).join(''))) { cur.push(r1); continue; }
      if (cur.length) { pages.push(cur); cur = []; queue.unshift(q); continue; }
      var words = q.text.split(/(\s+)/), lo = 1, hi = words.length - 1, best = 0;
      while (lo <= hi) { var mid = (lo + hi) >> 1; if (fits(row(q, words.slice(0, mid).join(''), true))) { best = mid; lo = mid + 1; } else hi = mid - 1; }
      if (!best) best = 1;
      pages.push([row(q, words.slice(0, best).join(''), true)]);
      queue.unshift({ e: q.e, text: words.slice(best).join('').replace(/^\s+/, ''), cont: true });
    }
    if (cur.length || !pages.length) pages.push(cur.length ? cur : ['<div class="ent"><div class="c muted">No entries in the selected range.</div></div>']);
    host.remove();
    return pages.map(function (pg, i) { return sheet(pg.join(''), i, pages.length); }).join('');
  });
}

/* =====================================================================

 * ===================================================================== */
var SENS_GROUPS = [

    { id: 'dod', name: 'DoD Community Only' }] },
  { key: 'C', name: 'Controlled', items: [
    { id: 'cui', name: 'CUI', cui: 1 },
    { id: 'cuiSecInt', name: 'CUI - Secured (Internal Only)', cui: 1, fill: '#e8b500', lock: 1 },
    { id: 'cuiRecip', name: 'CUI - Recipients Only', cui: 1, fill: '#1f4fd8', lock: 1 },
    { id: 'cuiDod', name: 'CUI - DoD Community Only', cui: 1, fill: '#2a9d3a', lock: 1 },
    { id: 'cuiNoAi', name: 'CUI - AI Prohibited', cui: 1 },
    { id: 'cuiNoAiInt', name: 'CUI - AI Prohibited (Internal Only)', cui: 1, lock: 1 }] },
  { key: 'A', name: 'ANG', items: [
    { id: 'angOnly', name: 'ANG Only', lock: 1 },
    { id: 'cuiAng', name: 'CUI - ANG Only', cui: 1, lock: 1 }] }

var SENS_LDC = ['', 'NOFORN', 'FED ONLY', 'FEDCON', 'NOCON', 'DL ONLY', 'DISPLAY ONLY'];

function sensId() {
  var v = (App.idx && App.idx.settings && App.idx.settings.sensLabel) || (App.status && App.status.sensLabel) || 'cui';

/* ---------- printouts ---------- */
// Adds the banner and designation indicator to printable sheets. One-page sheets (task org chart) get them
// inside the sheet; flowing sheets (STS, reports, PIN slips) get them in the page margins of every printed page.
function markSheets(html) {
  var b = sensBanner() || (sensHandling() ? sensHandling().toUpperCase() : ''), ind = sensIndicator();
  if (!b) return html;
  var box = document.createElement('div'); box.innerHTML = html;
  [].slice.call(box.querySelectorAll('.sheet')).forEach(function (sh, i) {
    if (sh.classList.contains('f623')) return; // the 623A builds its own markings into the form's margins
    var di = i === 0 && ind.length ? ind.map(esc).join('<br>') : '';
    if (sh.classList.contains('landscape')) { // one fixed page: markings sit inside the sheet
      sh.insertAdjacentHTML('afterbegin', '<div class="mk mk-t">' + esc(b) + '</div>');
      sh.insertAdjacentHTML('beforeend', '<div class="mk mk-b">' + esc(b) + '</div>' + (di ? '<div class="mk-di">' + di + '</div>' : ''));
      return;
    }
    sh.classList.add('flow'); // flowing pages: the print uses page-margin markings on every page (printPageCss)
    sh.insertAdjacentHTML('afterbegin', '<div class="mk scr">' + esc(b) + '</div>');
    sh.insertAdjacentHTML('beforeend', (di ? '<div class="mk-di scr">' + di + '</div>' : '') + '<div class="mk scr">' + esc(b) + '</div>');
  });
  return box.innerHTML;
}
function cssStr(s) { return '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"'; }
function printPageCss() {
  var b = sensBanner() || (sensHandling() ? sensHandling().toUpperCase() : ''), ind = sensIndicator();
  var mb = 'font:700 10pt Arial,Helvetica,sans-serif;color:#000';
  return '@media print{.sheet.flow{page:flow;width:auto;min-height:0!important;padding:0!important;box-shadow:none}.mk.scr,.mk-di.scr{display:none!important}}' +
    '@page flow{size:letter;margin:.6in .5in .75in .5in;' + (b ? '@top-center{content:' + cssStr(b) + ';' + mb + '}@bottom-center{content:' + cssStr(b) + ';' + mb + '}' : '') +
    '@bottom-right{content:"Page " counter(page) " of " counter(pages);font:7pt Arial,Helvetica,sans-serif}}' +
    (ind.length ? '@page flow:first{@bottom-left{content:' + cssStr(ind.join('\n')).replace(/\n/g, '\\A ') + ';white-space:pre;font:6.5pt/1.25 Arial,Helvetica,sans-serif;text-align:left;vertical-align:top;padding-top:4pt}}' : '');
}

    var d = res.data, n = (d.tables.files || []).length;
    if (n) toast('Adding ' + n + ' attached file' + (n === 1 ? '' : 's') + ' to the backup…', '', 5000);
    return backupWithFiles(d);
  }).then(function (d) {
    d.marking = sensMarking(); downloadText(markName('cfetp-tracker-backup-' + today() + '.json'), JSON.stringify(d), 'application/json');
    toast('Backup downloaded. It holds everyone\'s records — handle it as CUI.', 'ok', 6000);
  }).catch(function () {});
});
// A backup carries the attached files (certificate scans, signatures, logo) so a move to another copy of the tracker is complete.
function backupWithFiles(data) {
  var list = (data.tables && data.tables.files) || [];
  data.blobs = {};
  return list.reduce(function (pr, f) {
    return pr.then(function () { return API.call('getFile', { id: f.id }, { silent: true, quiet: true }).then(function (r) { if (r && r.b64) data.blobs[f.id] = r.b64; }, function () {}); });
  }, Promise.resolve()).then(function () { return data; });
}
function restoreBlobs(data) {
  var list = ((data.tables && data.tables.files) || []).filter(function (f) { return data.blobs && data.blobs[f.id]; }), n = 0, fail = 0;
  return list.reduce(function (pr, f) {
    return pr.then(function () { return API.call('restoreFile', { meta: f, b64: data.blobs[f.id] }, { silent: true, quiet: true }).then(function () { n++; }, function () { fail++; }); });
  }, Promise.resolve()).then(function () { return { n: n, fail: fail }; });
}
act('restore', function (el) {
  var replace = el.getAttribute('data-mode') === 'replace';
  pickFile('.json,application/json').then(function (files) {
    if (!files.length) return;
    files[0].text().then(function (t) {
      var data = JSON.parse(t);
      if (data.format !== 'cfetp-tracker-backup') throw new Error('Not a tracker backup file.');
      return confirmBox((replace ? 'REPLACE all tracker data with this backup' : 'Merge this backup') + ' from ' + fmtDateTime((data.exportedAt || '').substring(0, 19)) + '?', { danger: replace, ok: replace ? 'Replace' : 'Merge', requireText: replace ? 'REPLACE' : '' }).then(function (ok) {
        if (!ok) return;
        return API.call('restoreAll', { data: { format: data.format, version: data.version, exportedAt: data.exportedAt, tables: data.tables }, replace: replace }).then(function () { return restoreBlobs(data); }).then(function (r) { toast('Restored.' + (r.fail ? ' ' + r.fail + ' attached file(s) could not be re-attached.' : ''), r.fail ? 'warn' : 'ok'); return reboot(); });
      });
    }).catch(function (e) { toast(e.message || e.error || 'Could not restore.', 'bad'); });
  });
});
